<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>✨ Afirmaciones y Oraciones Diarias</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--text:#fff;--shadow:rgba(0,0,0,0.3)}
html,body{height:100%;overflow:hidden;font-family:'Montserrat',sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(135deg,#0a0a2e 0%,#1a0a3e 50%,#0d1b2a 100%);
transition:background 1.5s ease;color:var(--text);text-align:center;padding:20px;position:relative}

/* Stars animation */
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 70%);border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite;box-shadow:0 0 6px 2px rgba(255,255,255,0.3)}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}

/* Main content */
.container{position:relative;z-index:1;max-width:600px;width:100%;display:flex;flex-direction:column;align-items:center;gap:30px}

/* Header */
.header{display:flex;align-items:center;gap:10px;opacity:0.9}
.header h1{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;letter-spacing:2px;text-transform:uppercase}

/* Day counter */
.day-counter{font-size:0.85rem;opacity:0.85;letter-spacing:3px;font-weight:400;color:rgba(180,180,255,0.9)}

/* Affirmation card */
.card{background:rgba(10,10,40,0.6);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
border:1px solid rgba(100,100,255,0.15);border-radius:24px;padding:40px 30px;
min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;
width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.08);transition:all 0.5s ease;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
background:radial-gradient(circle,rgba(255,255,255,0.05) 0%,transparent 70%);
animation:shimmer 8s linear infinite}
@keyframes shimmer{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.affirmation-text{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;
line-height:1.7;letter-spacing:0.5px;position:relative;z-index:1;
text-shadow:0 2px 15px rgba(0,0,0,0.5),0 0 30px rgba(0,0,0,0.3);font-style:italic;color:rgba(255,255,255,0.95)}
.affirmation-text::before{content:'"';font-size:3rem;opacity:0.3;position:absolute;
top:-20px;left:-10px;font-family:serif}
.author{font-size:0.75rem;opacity:0.7;margin-top:15px;letter-spacing:2px;font-weight:400;position:relative;z-index:1;color:rgba(160,160,255,0.8)}

/* Buttons */
.btn-row{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}
.btn{background:rgba(20,20,60,0.5);border:1px solid rgba(100,100,255,0.25);
border-radius:50px;padding:12px 24px;color:#fff;font-family:'Montserrat',sans-serif;
font-size:0.8rem;letter-spacing:1px;cursor:pointer;transition:all 0.3s ease;
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px}
.btn:hover{background:rgba(255,255,255,0.25);transform:translateY(-2px)}
.btn:active{transform:scale(0.95)}
.btn.active{background:rgba(255,255,255,0.3);border-color:rgba(255,255,255,0.6)}
.btn-icon{font-size:1.1rem}

/* Settings panel */
.settings{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,20,0.95);
backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);z-index:100;
display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:20px}
.settings.show{display:flex}
.settings h2{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;margin-bottom:10px}
.settings-group{width:100%;max-width:400px;text-align:left}
.settings-group label{display:block;font-size:0.8rem;opacity:0.7;margin-bottom:5px;letter-spacing:1px}
.settings-group select,.settings-group input{width:100%;padding:12px;border-radius:12px;
border:1px solid rgba(100,100,255,0.2);background:rgba(15,15,40,0.8);color:rgba(200,200,255,0.95);
font-family:'Montserrat',sans-serif;font-size:0.9rem;backdrop-filter:blur(10px)}
.settings-group input[type=time]{color-scheme:dark}
.close-btn{position:absolute;top:20px;right:20px;background:none;border:none;color:#fff;
font-size:2rem;cursor:pointer;opacity:0.7}
.close-btn:hover{opacity:1}
.notify-btn{background:rgba(20,20,60,0.5);border:1px solid rgba(100,100,255,0.3);
border-radius:12px;padding:15px;color:rgba(200,200,255,0.95);font-family:'Montserrat',sans-serif;
font-size:0.9rem;cursor:pointer;width:100%;max-width:400px;transition:all 0.3s}
.notify-btn:hover{background:rgba(30,30,80,0.6)}
.notify-btn.granted{background:rgba(76,175,80,0.3);border-color:rgba(76,175,80,0.6)}

/* Notification toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
background:rgba(15,15,40,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
border:1px solid rgba(100,100,255,0.2);border-radius:16px;padding:15px 25px;
font-size:0.85rem;z-index:200;transition:transform 0.5s ease;max-width:90%;
color:rgba(200,200,255,0.95)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Swipe hint */
.swipe-hint{position:fixed;bottom:15px;font-size:0.7rem;opacity:0.4;letter-spacing:2px;z-index:1}

/* Fade animation */
.fade-in{animation:fadeIn 0.8s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:480px){
.affirmation-text{font-size:1.3rem}
.card{padding:30px 20px;min-height:200px}
.header h1{font-size:1.1rem}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <div class="header">
    <span style="font-size:1.5rem">✨</span>
    <h1>✨ Afirmaciones y Oraciones</h1>
  </div>
  
  <div class="day-counter" id="dayCounter">DÍA 1 DE 372</div>
  
  <div class="card fade-in" id="card">
    <div class="affirmation-text" id="affirmation">Cargando...</div>
    <div class="author" id="author"></div>
  </div>
  
  <div class="btn-row">
    <button class="btn active" id="btnAffirm" onclick="setMode('affirm')"><span class="btn-icon">✨</span> Afirmaciones</button>
    <button class="btn" id="btnPrayer" onclick="setMode('prayer')"><span class="btn-icon">🙏</span> Oraciones</button>
  </div>
  
  <div class="btn-row">
    <button class="btn" onclick="prevDay()"><span class="btn-icon">◀</span> Anterior</button>
    <button class="btn" onclick="randomAffirmation()"><span class="btn-icon">🎲</span> Aleatorio</button>
    <button class="btn" onclick="nextDay()"><span class="btn-icon">▶</span> Siguiente</button>
  </div>
  
  <div class="btn-row">
    <button class="btn" onclick="toggleMusic()" id="musicBtn"><span class="btn-icon">🎵</span> Música</button>
    <button class="btn" onclick="shareAffirmation()"><span class="btn-icon">📤</span> Compartir</button>
    <button class="btn" onclick="toggleSettings()"><span class="btn-icon">⚙️</span> Ajustes</button>
  </div>
  
  <!-- Audio player (hidden) -->
  <audio id="audioPlayer" loop preload="auto">
    <source src="musica_loop.mp3" type="audio/mpeg">
  </audio>
  <!-- Volume control -->
  <div class="volume-row" id="volumeRow" style="display:none">
    <span style="font-size:0.8rem;opacity:0.7">🔊</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="30" oninput="setVolume(this.value)" style="width:120px;accent-color:rgba(100,100,255,0.8)">
    <span style="font-size:0.8rem;opacity:0.7" id="volumeLabel">30%</span>
  </div>
</div>

<div class="settings" id="settings">
  <button class="close-btn" onclick="toggleSettings()">×</button>
  <h2>⚙️ Ajustes</h2>
  
  <div class="settings-group">
    <label>🌅 Recordatorio mañana</label>
    <input type="time" id="notifMorning" value="08:00">
  </div>
  
  <div class="settings-group">
    <label>☀️ Recordatorio medio día</label>
    <input type="time" id="notifNoon" value="12:00">
  </div>
  
  <div class="settings-group">
    <label>🌅 Recordatorio tarde</label>
    <input type="time" id="notifAfternoon" value="17:00">
  </div>
  
  <div class="settings-group">
    <label>🌙 Recordatorio noche</label>
    <input type="time" id="notifNight" value="21:00">
  </div>
  
  <button class="notify-btn" id="notifyBtn" onclick="requestNotifications()">
    🔔 Activar notificaciones
  </button>
  
  <button class="notify-btn" onclick="saveSettings()">
    💾 Guardar ajustes
  </button>
</div>

<div class="toast" id="toast"></div>
<div class="swipe-hint">◀ desliza ▶</div>

<script>
// ═══════════════════════════════════════════
// 372 AFIRMACIONES ÚNICAS
// ═══════════════════════════════════════════
const affirmations=[
// EMMET FOX - DECRETOS (30)
{t:"Yo Soy hijo de Dios. Yo Soy expresión perfecta de la vida divina.",a:"Emmet Fox"},
{t:"No hay poder fuera de tu imaginación, porque tu imaginación es Dios mismo en acción.",a:"Emmet Fox"},
{t:"El sentido del fin precede y determina la secuencia de hechos externos.",a:"Neville Godard"},
{t:"La sensación antecede a la evidencia. Quien espera a ver para sentir solo multiplica la espera.",a:"Emmet Fox"},
{t:"Tu mundo no es sino tu imaginación objetivada.",a:"Emmet Fox"},
{t:"Contemplo las cosas que no son como si fuesen. Yo no mendigo a la vida. Yo decreto.",a:"Emmet Fox"},
{t:"Yo Soy la salud de Dios. El Espíritu Santo vivifica cada célula de mi ser.",a:"Emmet Fox"},
{t:"Yo Soy la abundancia divina manifestándose ahora.",a:"Emmet Fox"},
{t:"Yo Soy el amor divino envolviendo y atrayendo todo lo perfecto a mi vida.",a:"Emmet Fox"},
{t:"Yo Soy la paz de Dios manifestándose ahora en mí.",a:"Emmet Fox"},
{t:"Yo Soy rodeado por la luz invencible de Dios.",a:"Emmet Fox"},
{t:"Mi palabra no vuelve vacía, porque sale cargada del poder del Espíritu Santo.",a:"Emmet Fox"},
{t:"El ángel de Jehová acampa a mi alrededor y me defiende en todo momento.",a:"Emmet Fox"},
{t:"Yo Soy guiado en cada paso por la sabiduría infinita de Dios.",a:"Emmet Fox"},
{t:"Todo lo que hago lo hago como para el Señor.",a:"Emmet Fox"},
{t:"Hoy avanzo con facilidad y alegría. Mis caminos son suaves, mis pasos son firmes.",a:"Emmet Fox"},
{t:"Yo Soy la abundancia de Dios en expresión. Nada me falta.",a:"Emmet Fox"},
{t:"Bendigo y libero el pasado. Todo está perdonado, todo está sanado.",a:"Emmet Fox"},
{t:"Yo Soy libre en Cristo. Yo Soy la expresión viviente de la libertad divina.",a:"Emmet Fox"},
{t:"Yo Soy uno con la riqueza infinita de Dios.",a:"Emmet Fox"},
{t:"Yo Soy la opulencia divina manifestándose ahora en mi vida.",a:"Emmet Fox"},
{t:"Dios llama las cosas que no son como si fuesen. — Romanos 4:17",a:"Emmet Fox"},
{t:"No te preguntes por los medios. La semilla se descompone y brota como un hecho nuevo.",a:"Emmet Fox"},
{t:"Yo Soy la fortaleza de Dios renovándome ahora.",a:"Emmet Fox"},
{t:"Yo Soy el gozo de Dios en expresión. Mi alma canta, mi espíritu danza.",a:"Emmet Fox"},
{t:"Yo Soy el servidor del amor divino. Sirvo con alegría, sirvo con gratitud.",a:"Emmet Fox"},

{t:"Hoy soy guiado, protegido y sostenido por la presencia de Dios.",a:"Emmet Fox"},

// FLORENCE SCOVEL SHINN - DINERO (19)
{t:"Soy abundancia divina.",a:"F. Scovel Shinn"},

{t:"Siempre soy sostenido por la abundancia infinita del universo.",a:"F. Scovel Shinn"},
{t:"Dinero querido, rompo todos los patrones de escasez de mi linaje familiar.",a:"F. Scovel Shinn"},
{t:"Asimilo ahora la vibración de la abundancia universal.",a:"F. Scovel Shinn"},
{t:"Doy gracias anticipadas por la abundancia visible y la invisible.",a:"F. Scovel Shinn"},
{t:"Mi orden divina está siendo ejecutada ahora.",a:"F. Scovel Shinn"},

{t:"Bendigo esta abundancia y doy gracias porque se multiplica.",a:"F. Scovel Shinn"},
{t:"Reconozco que aprendí esto de ti. Ahora elijo liberarme de esta creencia.",a:"F. Scovel Shinn"},
{t:"Te perdono por enseñarme lo que sabías sobre el dinero, aunque no era verdad universal.",a:"F. Scovel Shinn"},
{t:"La vida entera es circulación. Todo lo que circula vive.",a:"F. Scovel Shinn"},

// NEVILLE GODARD - TIEMPO COMPRIMIDO (22)
{t:"El futuro no es un territorio inexplorado, sino una realidad psicológica tan viva como cualquier recuerdo.",a:"Neville Godard"},
{t:"El tiempo es en su raíz una convención mental, una costumbre del alma dormida.",a:"Neville Godard"},
{t:"Cruzar el umbral psicológico significa salir de la identificación con el presente físico.",a:"Neville Godard"},
{t:"El acto creador no es solo proyectar hacia adelante, sino retroceder desde el fin cumplido.",a:"Neville Godard"},
{t:"La anticipación es simplemente la memoria en reversa.",a:"Neville Godard"},
{t:"No existe otro mecanismo. La conciencia es el puente.",a:"Neville Godard"},
{t:"La ansiedad surge de una fe incompleta.",a:"Neville Godard"},
{t:"La semilla plantada no requiere ser desenterrada cada día para comprobar su progreso.",a:"Neville Godard"},

{t:"Cada vez que pronuncias Yo Soy invocas la presencia operativa de la divinidad en ti.",a:"Neville Godard"},

// EMMET FOX - CONCIENCIA DEL CRISTO (40)

// NEVILLE GODARD - EL ESPEJO DE DIOS (38)

{t:"Si deseas transformar tu mundo, no luches contra la materia. Transforma tu expresión interior.",a:"Neville Godard"},
{t:"Nada aparece allí afuera que no haya sido emitido desde dentro.",a:"Neville Godard"},
{t:"Tu cuerpo no es tu cárcel. Es tu mapa.",a:"Neville Godard"},
{t:"El espejo que revela lo invisible no está en el mundo externo. Está en tu interior.",a:"Neville Godard"},
{t:"La visión espiritual no es un don reservado a unos pocos. Es una capacidad inherente a todos.",a:"Neville Godard"},
{t:"No eres un personaje que vive en un mundo. Eres la conciencia misma que sueña al mundo.",a:"Neville Godard"},
{t:"Solo quien olvida puede recordar. Solo quien desciende puede ascender.",a:"Neville Godard"},
{t:"Tú no eres un ser que busca a Dios. Tú eres Dios recordándose en forma humana.",a:"Neville Godard"},
{t:"Habitar el mundo sabiendo que tú eres su fuente.",a:"Neville Godard"},
{t:"Tú no eres una criatura de Dios. Tú eres Dios soñando ser una criatura.",a:"Neville Godard"},
{t:"La carne no es tu prisión. Es el velo donde Dios se oculta de sí mismo.",a:"Neville Godard"},
{t:"No hay distancia entre tú y Dios. La única distancia es el olvido.",a:"Neville Godard"},
{t:"Tú eres el sueño de Dios. Y ahora estás empezando a soñar lúcido.",a:"Neville Godard"},
{t:"No tienes que crear tu realidad. Ya la estás creando sin saberlo.",a:"Neville Godard"},
{t:"No eres un resultado del tiempo. Eres anterior al tiempo.",a:"Neville Godard"},
{t:"Tú crees que naciste, pero lo que nació fue el velo.",a:"Neville Godard"},
{t:"Nunca fuiste criatura. Siempre fuiste creador.",a:"Neville Godard"},
{t:"La serpiente no tentó. Invitó al despertar.",a:"Neville Godard"},
{t:"Solo en el contraste se puede descubrir la luz.",a:"Neville Godard"},
{t:"Eres el puente entre lo eterno y lo temporal. Eres el fuego encarnado.",a:"Neville Godard"},

// NEVILLE GODARD - DIOS ESTÁ SOÑANDO SER TÚ (30)
{t:"El pecado no es un acto moral. Es el olvido del ser.",a:"Neville Godard"},
{t:"Hay un trono vacío en el corazón del hombre. Es el asiento eterno del Yo Soy.",a:"Neville Godard"},
{t:"No hay mayor poder que asumir el trono interno.",a:"Neville Godard"},
{t:"La caída no fue condena. Fue decisión.",a:"Neville Godard"},
{t:"El pasado no es una piedra. Es una página escrita con la tinta de tu interpretación.",a:"Neville Godard"},
{t:"Tú puedes cambiar el pasado en el registro viviente de tu alma.",a:"Neville Godard"},
{t:"No hay cárcel más profunda que una memoria mal sostenida.",a:"Neville Godard"},
{t:"Asume un nuevo pasado. Declara que siempre fuiste abundante, amado, guiado.",a:"Neville Godard"},
{t:"Tú eres el escriba del libro sagrado. Tú eres el lector, el autor y el protagonista.",a:"Neville Godard"},
{t:"Cristo no es un personaje. Es un estado de conciencia.",a:"Neville Godard"},
{t:"Cristo no se alcanza desde el esfuerzo. Cristo se asume.",a:"Neville Godard"},
{t:"La segunda venida ocurre cada vez que alguien recuerda quién es.",a:"Neville Godard"},
{t:"El reino no viene. Se revela en quien recuerda.",a:"Neville Godard"},
{t:"Habita el fin. Siéntelo como si ya fuese.",a:"Neville Godard"},
{t:"Yo Soy el Alfa y la Omega. El principio y el fin.",a:"Neville Godard"},
{t:"No digas Yo Soy buscando. Di Yo Soy encontrando.",a:"Neville Godard"},
{t:"No digas Yo Soy esperando un milagro. Di Yo Soy el milagro hecho carne.",a:"Neville Godard"},
{t:"Tú eres en todo momento lo que declaras ser con certeza.",a:"Neville Godard"},
{t:"Cristo no regresa. Cristo despierta. Y lo hace en ti.",a:"Neville Godard"},
{t:"Tú eres la segunda venida hecha carne.",a:"Neville Godard"},
{t:"El final del sueño no es una huida. Es un ascenso silencioso a la identidad original.",a:"Neville Godard"},
{t:"No hay afuera. Todo ocurre en ti, como tú, a través de ti.",a:"Neville Godard"},
{t:"Convertirse en el que imagina es dejar de ser efecto y convertirse en causa.",a:"Neville Godard"},
{t:"Dios jamás estuvo distante porque tú eres ese Dios soñando, sintiendo, creando.",a:"Neville Godard"},
{t:"El árbol está en ti. La serpiente eres tú. El fruto es tu deseo de recordar.",a:"Neville Godard"},
{t:"Yo soy el que era, el que es y el que será.",a:"Neville Godard"},
{t:"El Edén no es un lugar. Es un estado de conciencia original.",a:"Neville Godard"},
{t:"Tú eres el ungido cuando dejas de buscar.",a:"Neville Godard"},
{t:"La materia no es la realidad esencial. Es su eco.",a:"Neville Godard"},
{t:"Lo que llamas sólido es solo una frecuencia estabilizada.",a:"Neville Godard"},

// JOSEPH MURPHY - SANGRE PRÓSPERA (30)
{t:"Todo lo que circula vive. Todo lo que se estanca muere.",a:"Joseph Murphy"},
{t:"El dinero es la sangre de la vida material. Es un torrente de energía.",a:"Joseph Murphy"},
{t:"Tu prosperidad no depende de la suerte. Depende de la imagen que sostienes en tu interior.",a:"Joseph Murphy"},
{t:"La gratitud es el oxígeno de esa sangre económica.",a:"Joseph Murphy"},
{t:"Quien agradece multiplica. Quien se queja corta la circulación.",a:"Joseph Murphy"},
{t:"Mi mente fluye, mi dinero fluye, mi vida fluye.",a:"Joseph Murphy"},
{t:"Si ves el gasto como siembra, programas tu interior para prosperar.",a:"Joseph Murphy"},
{t:"La gratitud convierte la gota en río, el puñado en cosecha, la semilla en bosque.",a:"Joseph Murphy"},
{t:"No esperes tener mucho para agradecer. Agradece ahora y lo mucho vendrá.",a:"Joseph Murphy"},
{t:"La pobreza no es destino. Es obstrucción mental.",a:"Joseph Murphy"},
{t:"Yo soy digno de recibir riqueza. La abundancia es mi derecho natural.",a:"Joseph Murphy"},
{t:"Mi corazón de oro late con la abundancia del infinito.",a:"Joseph Murphy"},
{t:"La alegría engorda los bolsillos.",a:"Joseph Murphy"},
{t:"La risa no es consecuencia de la riqueza. Es la causa.",a:"Joseph Murphy"},
{t:"La alegría abre la puerta de la prosperidad. La tristeza es un candado.",a:"Joseph Murphy"},
{t:"Lo que doy circula y en círculos perfectos regresa multiplicado a mí.",a:"Joseph Murphy"},
{t:"Dar no empobrece. Enriquece.",a:"Joseph Murphy"},
{t:"No eres la fuente del dinero. Eres el canal.",a:"Joseph Murphy"},
{t:"El miedo asfixia. La fe respira.",a:"Joseph Murphy"},
{t:"Mi subconsciente es un banco infinito. Yo deposito ideas de riqueza.",a:"Joseph Murphy"},
{t:"Fe + imagen = prosperidad.",a:"Joseph Murphy"},
{t:"Soy próspero ahora. La riqueza fluye en mí. La abundancia me rodea.",a:"Joseph Murphy"},
{t:"La fe no es esperar. Es poseer. No es futuro. Es presente.",a:"Joseph Murphy"},
{t:"La riqueza late en equilibrio. No vivo en escasez ni en avaricia.",a:"Joseph Murphy"},
{t:"Yo soy el cauce perfecto del río de abundancia infinita.",a:"Joseph Murphy"},
{t:"Nada me falta. Todo circula, todo retorna multiplicado.",a:"Joseph Murphy"},
{t:"El río no guarda, circula. No teme, avanza. No se estanca, corre.",a:"Joseph Murphy"},
{t:"Agradezco todo. Respiro abundancia. Vivo en prosperidad.",a:"Joseph Murphy"},
{t:"El que agradece lo pequeño, multiplica lo pequeño en grande.",a:"Joseph Murphy"},
{t:"Yo declaro que todo bloqueo se disuelve. Mi prosperidad fluye sin obstáculos.",a:"Joseph Murphy"},

// JOSEPH MURPHY - ÁRBOL DE LA PALABRA VIVA (28)
{t:"El decreto es orden, no súplica. Es ley, no esperanza.",a:"Joseph Murphy"},
{t:"Tú siembras, ella produce. Tú decretas, ella ejecuta.",a:"Joseph Murphy"},
{t:"Tu subconsciente es tierra fértil. Acepta y al aceptar reproduce.",a:"Joseph Murphy"},
{t:"Lo que se imprime en tu subconsciente con emoción se expresará en tu realidad.",a:"Joseph Murphy"},
{t:"La duda es el veneno de la mente creativa.",a:"Joseph Murphy"},
{t:"Cada célula de mi cuerpo está viva con la luz curativa de Dios.",a:"Joseph Murphy"},
{t:"La inteligencia curativa de Dios está operando ahora en cada célula de mi cuerpo.",a:"Joseph Murphy"},
{t:"Soy una fuente de ideas prósperas. Mi vida tiene dirección clara.",a:"Joseph Murphy"},
{t:"Donde yo voy, Dios va conmigo.",a:"Joseph Murphy"},
{t:"Yo soy paz, yo soy protección. Yo soy intocable en el bien.",a:"Joseph Murphy"},
{t:"Cancelo este temor. El amor disuelve todo miedo.",a:"Joseph Murphy"},
{t:"Yo me perdono completamente. Aprendo, crezco, me libero.",a:"Joseph Murphy"},
{t:"La inspiración fluye en mí como un río inagotable.",a:"Joseph Murphy"},
{t:"Mi voz es clara, segura y magnética.",a:"Joseph Murphy"},
{t:"Aprendo con facilidad, rapidez y gozo.",a:"Joseph Murphy"},
{t:"Yo soy manifestación viva. Mi palabra crea, mi fe ejecuta, mi mente obedece.",a:"Joseph Murphy"},
{t:"Decretado está, cumplido es.",a:"Joseph Murphy"},
{t:"Yo soy el dueño de mi palabra y mi mundo.",a:"Joseph Murphy"},
{t:"Decreto solo el bien. Recibo solo el bien. Comparto solo el bien.",a:"Joseph Murphy"},
{t:"Desde hoy mi vida es un árbol eterno de frutos benditos.",a:"Joseph Murphy"},
{t:"Cada vez que hablas con intención, siembras en el campo fértil de tu subconsciente.",a:"Joseph Murphy"},
{t:"Decreto salud perfecta en cada célula de mi cuerpo. Así es y así será.",a:"Joseph Murphy"},
{t:"Mi mente está en calma. Nada externo me domina.",a:"Joseph Murphy"},
{t:"Estoy rodeado de luz divina. Ningún mal puede tocarme.",a:"Joseph Murphy"},
{t:"Mis huesos son flexibles, mi sangre es vibrante, mi cuerpo es un templo en armonía.",a:"Joseph Murphy"},
{t:"Mi memoria es perfecta, ordenada y confiable.",a:"Joseph Murphy"},
{t:"Mi mente es ágil. Cada concepto se fija y fluye en mí.",a:"Joseph Murphy"},
{t:"Todo está bien en mi mundo. Entrego mis pensamientos al amor infinito.",a:"Joseph Murphy"},

// EMMET FOX - CUANDO DIOS HABLA EN SILENCIO (28)
{t:"Dios no grita. El espíritu susurra.",a:"Emmet Fox"},
{t:"Solo el recipiente vacío puede recibir.",a:"Emmet Fox"},
{t:"Estad quietos y conoced que yo soy Dios. — Salmo 46:10",a:"Emmet Fox"},
{t:"La verdadera quietud es un estado de expectativa sagrada.",a:"Emmet Fox"},
{t:"La voz de Dios es calma, seguridad, certeza. Nunca con miedo.",a:"Emmet Fox"},
{t:"El bien nunca se pierde.",a:"Emmet Fox"},
{t:"El silencio verdadero no es la ausencia de vida, sino la plenitud del ser.",a:"Emmet Fox"},
{t:"La perseverancia vale más que la perfección.",a:"Emmet Fox"},
{t:"El ego teme el silencio porque allí pierde su dominio.",a:"Emmet Fox"},
{t:"La música no vive solo en las notas, sino en los silencios entre ellas.",a:"Emmet Fox"},
{t:"La paz imperturbable es la paz de Cristo que duerme en la barca.",a:"Emmet Fox"},
{t:"El silencio restaura las fuerzas como un manantial oculto en el desierto.",a:"Emmet Fox"},
{t:"El alma que sabe callar sabe amar.",a:"Emmet Fox"},
{t:"La decisión tomada desde el silencio es la única que permanece.",a:"Emmet Fox"},
{t:"Haz del silencio tu hogar y tu vida será un faro de paz.",a:"Emmet Fox"},
{t:"Lo que hoy parece confuso, mañana será revelación.",a:"Emmet Fox"},
{t:"Nada se pierde para quien escribe en presencia de Dios.",a:"Emmet Fox"},
{t:"La verdadera medida de la quietud se revela en la tempestad.",a:"Emmet Fox"},
{t:"La acción nacida del silencio es certera. La reacción nacida del miedo es débil.",a:"Emmet Fox"},
{t:"Cuando el mundo grite, que tu alma calle.",a:"Emmet Fox"},
{t:"Nada puede sacudir el centro donde Dios habita en ti.",a:"Emmet Fox"},
{t:"Todo lo grande, lo duradero, lo divino, se origina en el silencio.",a:"Emmet Fox"},
{t:"El silencio es el taller de Dios en tu interior.",a:"Emmet Fox"},
{t:"La sabiduría ama el orden. El espíritu premia la constancia.",a:"Emmet Fox"},
{t:"Dios no pide que apagues tu vida, sino que dejes de entorpecer la suya en ti.",a:"Emmet Fox"},
{t:"El silencio no depende del exterior, sino del centro interior.",a:"Emmet Fox"},
{t:"La voz de Dios invita, pero no obliga. Impulsa, pero no presiona.",a:"Emmet Fox"},
{t:"El verdadero pensamiento es dejar que la verdad te encuentre.",a:"Emmet Fox"},

// W.W. ATKINSON - EL ARTE DE PENSAR CON PODER (35)
{t:"El pensador dormido reacciona. El pensador despierto elige.",a:"W.W. Atkinson"},
{t:"Despertar significa darse cuenta de que cada pensamiento es un acto voluntario.",a:"W.W. Atkinson"},
{t:"Quien no observa sus pensamientos vive gobernado por ellos como un títere.",a:"W.W. Atkinson"},
{t:"El pensador despierto asume la soberanía sobre su mundo interno.",a:"W.W. Atkinson"},
{t:"Toda suerte, buena o mala, es resultado del estado mental sostenido.",a:"W.W. Atkinson"},
{t:"El pensamiento es energía en movimiento, vibración pura.",a:"W.W. Atkinson"},
{t:"Todo pensamiento es una onda. Y toda onda genera una reacción.",a:"W.W. Atkinson"},
{t:"Pensar sin emoción es soplar sobre brasas frías.",a:"W.W. Atkinson"},
{t:"Desde ahora yo pienso lo que quiero pensar.",a:"W.W. Atkinson"},
{t:"La mente no responde a impulsos ocasionales. Responde al mandato constante.",a:"W.W. Atkinson"},
{t:"Quien piensa por hábito, repite lo viejo. Quien piensa por voluntad, crea lo nuevo.",a:"W.W. Atkinson"},
{t:"Donde el ruido cesa, comienza la verdadera creación.",a:"W.W. Atkinson"},
{t:"El silencio no es vacío muerto, sino espacio fértil.",a:"W.W. Atkinson"},
{t:"La emoción es el combustible del pensamiento creador.",a:"W.W. Atkinson"},
{t:"Un pensamiento sin emoción es una semilla sin agua.",a:"W.W. Atkinson"},
{t:"El reino de los cielos está dentro de ti. Tu estado interior es el generador de tu mundo exterior.",a:"W.W. Atkinson"},
{t:"La ley mental es exacta como la gravedad. No se altera por ruegos.",a:"W.W. Atkinson"},
{t:"La realidad no ocurre. Se crea. Y el creador es siempre el pensamiento en acción.",a:"W.W. Atkinson"},
{t:"La voluntad es el piloto. La imaginación es la nave.",a:"W.W. Atkinson"},
{t:"El entorno no causa el estado mental. El entorno es su proyección.",a:"W.W. Atkinson"},
{t:"No se necesita cambiar el mundo. Se necesita cambiar la conciencia que lo genera.",a:"W.W. Atkinson"},
{t:"La mente es un canal que conecta el alma con la mente universal.",a:"W.W. Atkinson"},
{t:"El pensamiento con propósito, ritmo y dirección se convierte en destino.",a:"W.W. Atkinson"},
{t:"El pensador supremo no nace. Se revela.",a:"W.W. Atkinson"},
{t:"No necesitas poder. Ya lo eres.",a:"W.W. Atkinson"},
{t:"Tu mente es templo, tu palabra es decreto, tu emoción es combustible.",a:"W.W. Atkinson"},
{t:"Solo aquello a lo que prestamos atención adquiere poder en nuestra vida.",a:"W.W. Atkinson"},
{t:"El universo responde a lo que tú eres, no a lo que dices ser.",a:"W.W. Atkinson"},
{t:"La concentración no es tensión. Es enfoque amoroso.",a:"W.W. Atkinson"},
{t:"La visualización no es fantasía. Es arquitectura mental.",a:"W.W. Atkinson"},
{t:"La imagen mental sostenida con fe es la semilla de la realidad futura.",a:"W.W. Atkinson"},
{t:"La voluntad dirige, la imaginación modela. La realidad obedece.",a:"W.W. Atkinson"},
{t:"Donde la voluntad y la imaginación trabajan como uno, allí la realidad se doblega.",a:"W.W. Atkinson"},
{t:"La mente que piensa así no es víctima de los hechos. Es autora de ellos.",a:"W.W. Atkinson"},
{t:"Cuando pienses en paz, el universo entero se abrirá ante ti.",a:"W.W. Atkinson"},

// PARAMAHANSA YOGANANDA - LEY Y AMOR (28)
{t:"El hombre se convierte en aquello que medita constantemente.",a:"P. Yogananda"},
{t:"El aliento es la puerta maestra de la sanación.",a:"P. Yogananda"},
{t:"La oración científica es el puente entre el deseo humano y la respuesta divina.",a:"P. Yogananda"},
{t:"La intuición es la voz de Dios en el alma humana. Quien la sigue no hierra el camino.",a:"P. Yogananda"},
{t:"La luz divina restaura y renueva cada célula de mi ser. Soy salud, soy vida, soy plenitud.",a:"P. Yogananda"},
{t:"La disciplina es la guardiana de la libertad.",a:"P. Yogananda"},
{t:"La gracia no anula el esfuerzo, sino que lo corona y lo trasciende.",a:"P. Yogananda"},
{t:"La paz que no depende de las circunstancias brota de la conexión íntima con la fuente.",a:"P. Yogananda"},
{t:"Todo lo que existe vibra.",a:"P. Yogananda"},
{t:"El AUM es la firma audible de la presencia divina.",a:"P. Yogananda"},
{t:"Un pensamiento de amor eleva la vibración y predispone al entorno a responder con gracia.",a:"P. Yogananda"},
{t:"La respiración profunda, pausada y consciente restaura la calma interior.",a:"P. Yogananda"},
{t:"Afirmar no es negar la realidad, sino reeducar el subconsciente.",a:"P. Yogananda"},
{t:"Agradece, confía y permanece en paz. La ley nunca falla.",a:"P. Yogananda"},
{t:"La imaginación es el instrumento con el que el alma participa en la creación.",a:"P. Yogananda"},
{t:"Todo lo que el corazón concibe con profundidad y sostiene con fe se hace carne.",a:"P. Yogananda"},
{t:"La intuición no grita ni demanda. Susurra en lo profundo.",a:"P. Yogananda"},
{t:"Cuando la mente se aquieta, la verdad se revela espontáneamente.",a:"P. Yogananda"},
{t:"Si al pensar en una opción sientes paz, esa es la señal.",a:"P. Yogananda"},
{t:"La prosperidad auténtica es la expansión natural de la utilidad y del gozo.",a:"P. Yogananda"},
{t:"La generosidad auténtica no empobrece, sino que enriquece a quien la practica.",a:"P. Yogananda"},
{t:"Busca primero la utilidad y el gozo, y todo lo demás vendrá por añadidura.",a:"P. Yogananda"},
{t:"Las células del cuerpo obedecen las órdenes de la mente consciente.",a:"P. Yogananda"},
{t:"Mi cuerpo descansa en la paz divina. La salud se restaura mientras duermo.",a:"P. Yogananda"},
{t:"Los grandes cambios surgen de la perseverancia en lo pequeño.",a:"P. Yogananda"},
{t:"La rendición confiada coloca todos los frutos en manos de la sabiduría suprema.",a:"P. Yogananda"},
{t:"Permanece en mí y yo en ti.",a:"P. Yogananda"},
{t:"Estoy atento. Estoy en paz. Mi voluntad es firme y tranquila.",a:"P. Yogananda"},

// NAPOLEÓN HILL - ANTES DEL ORO (29)
{t:"La riqueza no se piensa, se siente. Y solo cuando se siente con intensidad comienza a existir.",a:"Napoleón Hill"},
{t:"Lo que usted siente con certeza, el mundo lo ejecuta.",a:"Napoleón Hill"},
{t:"El universo no responde al pensamiento débil. Responde a la emoción sostenida.",a:"Napoleón Hill"},
{t:"El oro no se encuentra con mapas, se encuentra con el corazón.",a:"Napoleón Hill"},
{t:"El sentimiento precede al oro.",a:"Napoleón Hill"},
{t:"El deseo ardiente, sellado y dirigido, mueve trenes enteros.",a:"Napoleón Hill"},
{t:"La geometría del deseo ardiente se mide: intensidad, duración y foco.",a:"Napoleón Hill"},
{t:"El deseo estructurado transforma. El deseo desordenado arrastra.",a:"Napoleón Hill"},
{t:"El subconsciente no obedece palabras vacías. Solo responde a imágenes cargadas de emoción.",a:"Napoleón Hill"},
{t:"Lo que usted siente con persistencia será más poderoso que cualquier herramienta técnica.",a:"Napoleón Hill"},
{t:"Uno no inventa por la mente. Inventa por la necesidad de lo que aún no existe.",a:"Napoleón Hill"},
{t:"La fe es la emoción del deseo cumplido que se siente como presente.",a:"Napoleón Hill"},
{t:"La riqueza no llega como recompensa. Llega como eco de una emoción total sostenida.",a:"Napoleón Hill"},
{t:"El oro no llega por azar. Llega porque no tiene otra opción.",a:"Napoleón Hill"},
{t:"El trabajo no produce riqueza. Es la descarga natural del sentimiento interno de riqueza.",a:"Napoleón Hill"},
{t:"Un acto sencillo hecho con espíritu de riqueza vale más que 1000 horas de labor mecánica.",a:"Napoleón Hill"},
{t:"El entorno externo es un espejo de lo que su emoción dominante sostiene en su interior.",a:"Napoleón Hill"},
{t:"Cuando lo arregle para su emoción, el mundo comenzará a arreglarse para usted.",a:"Napoleón Hill"},
{t:"El que se siente rico trabaja como quien confirma una verdad interior.",a:"Napoleón Hill"},
{t:"Usted será rico cuando su emoción de riqueza haya desplazado por completo toda duda.",a:"Napoleón Hill"},
{t:"Sienta como quien ordena. Sienta como quien construye. Sienta como quien ya posee.",a:"Napoleón Hill"},
{t:"La duda es la grieta por la cual se escapa el oro.",a:"Napoleón Hill"},
{t:"La pureza emocional no significa perfección. Significa coherencia.",a:"Napoleón Hill"},
{t:"Trabaje como quien ya es rico. No lo diga, no lo aparente. Siéntalo.",a:"Napoleón Hill"},
{t:"El espacio que usted habita se convierte en altar de su convicción.",a:"Napoleón Hill"},
{t:"El lenguaje del subconsciente es emocional, no lógico. Es pictórico, no verbal.",a:"Napoleón Hill"},
{t:"El pensamiento es la chispa, la emoción es la corriente, la imagen sentida es el mensaje.",a:"Napoleón Hill"},
{t:"El universo reconoce a quien ya está actuando como emisario de una riqueza sentida.",a:"Napoleón Hill"},
{t:"Cada mañana usted debe revivir su visión como una escena sentida profundamente.",a:"Napoleón Hill"},

// JOSEPH MURPHY - MAPA ESMERALDA (32)
{t:"Toda célula es mente organizada. Todo órgano es pensamiento solidificado.",a:"Joseph Murphy"},
{t:"Tu cuerpo no es un campo de batalla, es un campo de cultivo. Siembra luz, cosecharás luz.",a:"Joseph Murphy"},
{t:"Mis células obedecen la ley divina. El patrón original de mi cuerpo es armonía.",a:"Joseph Murphy"},
{t:"Toda enfermedad es una distorsión del patrón original. Toda curación es un retorno al diseño arquetípico.",a:"Joseph Murphy"},
{t:"Tu cuerpo responde a decretos. Cada célula es un escriba atento.",a:"Joseph Murphy"},
{t:"El cuerpo de carne es una sombra. La luz está en tu mente.",a:"Joseph Murphy"},
{t:"Toda palabra es una semilla vibratoria. Cada célula oye.",a:"Joseph Murphy"},
{t:"La vibración que tú emites determina tu salud, no tus deseos racionales.",a:"Joseph Murphy"},
{t:"El sonido reestructura el campo electromagnético.",a:"Joseph Murphy"},
{t:"El aire me vivifica, mis pensamientos fluyen, el espíritu circula en mí.",a:"Joseph Murphy"},
{t:"Yo filtro mis pensamientos. Mi mente limpia. Solo lo verdadero circula en mí.",a:"Joseph Murphy"},
{t:"El pasado está disuelto en la gracia eterna. Yo soy libre ahora. Mi historia es luz.",a:"Joseph Murphy"},
{t:"Yo redimo esta memoria. Yo soy el dueño de mi historia. Todo se reescribe en la luz.",a:"Joseph Murphy"},
{t:"Este espacio es luz. Cada rincón vibra en orden. Mi cuerpo reconoce esta frecuencia.",a:"Joseph Murphy"},
{t:"Yo soy limpio por dentro y por fuera. Mi espacio refleja mi armonía.",a:"Joseph Murphy"},
{t:"Este hogar es mi templo. Cada pared sostiene mi bienestar.",a:"Joseph Murphy"},
{t:"Lo que he recibido, lo comparto. Lo que bendigo crece. Yo soy multiplicador de luz.",a:"Joseph Murphy"},
{t:"Tú no estás roto. Tú estás en proceso.",a:"Joseph Murphy"},
{t:"No necesitas fórmulas secretas ni intermediarios místicos. El poder de regenerar está en ti.",a:"Joseph Murphy"},
{t:"Cada pensamiento que albergas activa procesos bioquímicos que se convierten en síntomas o en salud.",a:"Joseph Murphy"},
{t:"No esperes a enfermarte para reprogramar tus pensamientos. Hazlo ahora.",a:"Joseph Murphy"},
{t:"El espacio vibra y tú vibras con él.",a:"Joseph Murphy"},
{t:"Tu casa puede enfermarte o sanar según como la codifiques.",a:"Joseph Murphy"},
{t:"No puedes sanar tu piel sin mirar tu entorno.",a:"Joseph Murphy"},
{t:"La mayor prisión del ser humano no es el presente ni el futuro. Es el pasado no sanado.",a:"Joseph Murphy"},
{t:"Sanar el tiempo es sanar el cuerpo.",a:"Joseph Murphy"},
{t:"Enseñar no es adoctrinar. Enseñar es testimoniar.",a:"Joseph Murphy"},
{t:"Mi mente es firme. Mis manos están en paz. Yo soy fortaleza divina.",a:"Joseph Murphy"},
{t:"El milagro es la ley natural aplicada con fe constante e intención elevada.",a:"Joseph Murphy"},
{t:"Lo orgánico no es causa, es efecto. La carne no crea la idea, es la idea quien le da forma.",a:"Joseph Murphy"},
{t:"Tu cuerpo se convierte en lo que tu mente cree.",a:"Joseph Murphy"},
{t:"No declares lo que ves. Decreta lo que es.",a:"Joseph Murphy"},

// JOSEPH MURPHY - DECISIONES (30)
{t:"Toda decisión verdadera es una afirmación de fe operativa.",a:"Joseph Murphy"},
{t:"Decidir no es un acto lógico, es un acto espiritual.",a:"Joseph Murphy"},
{t:"La decisión perfecta es la que armoniza con la sabiduría interior.",a:"Joseph Murphy"},
{t:"Dejo que la sabiduría en mí elija ahora.",a:"Joseph Murphy"},
{t:"No existe tal cosa como una decisión neutral.",a:"Joseph Murphy"},
{t:"El hombre de doble ánimo es inconstante en todos sus caminos.",a:"Joseph Murphy"},
{t:"La verdadera paz no es la ausencia de movimiento, sino la presencia de dirección.",a:"Joseph Murphy"},
{t:"Toda decisión auténtica se reconoce por la paz que deja.",a:"Joseph Murphy"},
{t:"La paz es el árbitro que Dios colocó en tu alma para que nunca te pierdas.",a:"Joseph Murphy"},
{t:"No sigas la voz más fuerte. Sigue la más pacífica.",a:"Joseph Murphy"},
{t:"La sabiduría no grita, no presiona. La sabiduría susurra.",a:"Joseph Murphy"},
{t:"Mi mente está fija en el bien. La sabiduría en mí decide con orden perfecto.",a:"Joseph Murphy"},
{t:"La provisión del infinito fluye hacia mí con orden perfecto.",a:"Joseph Murphy"},
{t:"En silencio y confianza está mi fortaleza.",a:"Joseph Murphy"},
{t:"Mi decisión está sellada en paz. Camino en firmeza y gracia.",a:"Joseph Murphy"},
{t:"La paz de Dios gobierna mis decisiones.",a:"Joseph Murphy"},
{t:"Dios no nos ha dado espíritu de cobardía, sino de poder, amor y dominio propio.",a:"Joseph Murphy"},
{t:"Primero paz, luego decisión.",a:"Joseph Murphy"},
{t:"Lo que fue ahora sirve a mi bien. Lo entrego, lo bendigo, lo libero.",a:"Joseph Murphy"},
{t:"No pudiste haber elegido mejor en aquel momento, dado el nivel de conciencia que tenías.",a:"Joseph Murphy"},
{t:"El alma no avanza por olvido, sino por comprensión.",a:"Joseph Murphy"},
{t:"Nada fue en vano. Nada se pierde en la economía del espíritu.",a:"Joseph Murphy"},
{t:"Mi cuerpo responde a la paz de mi alma.",a:"Joseph Murphy"},
{t:"Prospero en todo, porque la sabiduría en mí elige el camino perfecto.",a:"Joseph Murphy"},
{t:"Todo coopera para mi bien. Todo está guiado. Todo responde al orden perfecto.",a:"Joseph Murphy"},
{t:"Elige lo que más bendice, lo que más edifica, lo que más sirve.",a:"Joseph Murphy"},
{t:"Camino en relaciones que elevan mi conciencia.",a:"Joseph Murphy"},
{t:"La regla de oro: haz a otros lo que quisieras que te hagan a ti.",a:"Joseph Murphy"},
{t:"Cada pensamiento de temor es una semilla abortiva. No siembres lo que luego lamentarás.",a:"Joseph Murphy"},
{t:"Confía en el Señor con todo tu corazón y no te apoyes en tu propia prudencia.",a:"Joseph Murphy"},

// ALEISTER CROWLEY - RIQUEZA MÁGICA (40)
{t:"Cada ser traza su trayectoria única, inconfundible, inevitable.",a:"A. Crowley"},
{t:"Todo sufrimiento brota de la fricción con trayectorias que no nos pertenecen.",a:"A. Crowley"},
{t:"El hombre que no conoce su voluntad es sombra arrastrada por vientos ajenos.",a:"A. Crowley"},
{t:"A cada uno su estrella. A cada estrella su órbita. A cada órbita su gloria.",a:"A. Crowley"},
{t:"La verdadera voluntad se manifiesta por continuidad sin fricción y aumento espontáneo de energía.",a:"A. Crowley"},
{t:"Todo acto que produce cansancio, confusión o arrepentimiento no es voluntad, sino desviación.",a:"A. Crowley"},
{t:"Tu única salvación es la ciencia rigurosa de ti mismo.",a:"A. Crowley"},
{t:"El pecado supremo es la restricción: negar la voluntad, disfrazarla, traicionarla.",a:"A. Crowley"},
{t:"Cada hombre y cada mujer es una estrella.",a:"A. Crowley"},
{t:"El capricho es efímero. La voluntad es inexorable como la órbita de los astros.",a:"A. Crowley"},
{t:"No busques consuelo en dogmas ajenos. Tu poder está en tu centro.",a:"A. Crowley"},
{t:"Sin juramento no hay obra. Sin registro no hay ciencia.",a:"A. Crowley"},
{t:"El registro mágico es el espejo donde se refleja la verdad desnuda.",a:"A. Crowley"},
{t:"Quien se miente en el registro se miente en la vida.",a:"A. Crowley"},
{t:"No hay mandato exterior, sino revelación interior.",a:"A. Crowley"},
{t:"El dominio no es negación, sino conducción.",a:"A. Crowley"},
{t:"El cuerpo es templo y laboratorio, jamás prisión ni mercado.",a:"A. Crowley"},
{t:"El mago ama sin poseer, goza sin mendicar, ofrece sin pedir recompensa.",a:"A. Crowley"},
{t:"La libertad consiste en elegir y ejecutar según la estrella.",a:"A. Crowley"},
{t:"Lo que no sirve a la voluntad será expulsado o transformado.",a:"A. Crowley"},
{t:"La defensa es principio de higiene, no de paranoia.",a:"A. Crowley"},
{t:"El primer deber es identificar drenajes de energía.",a:"A. Crowley"},
{t:"Más vale un aliado fiel que 100 aduladores.",a:"A. Crowley"},
{t:"El dinero es instrumento, fluido, canal de la voluntad.",a:"A. Crowley"},
{t:"Lo que se da se libera. Lo que se retiene sin causa se pudre.",a:"A. Crowley"},
{t:"La prueba es señal de avance, no de condena.",a:"A. Crowley"},
{t:"El oro solo se separa de la escoria bajo el crisol.",a:"A. Crowley"},
{t:"La espada se templa en el azote de la llama.",a:"A. Crowley"},
{t:"Transformar el fracaso en poder, la herida en conocimiento, la caída en impulso.",a:"A. Crowley"},
{t:"El amor bajo voluntad es ley.",a:"A. Crowley"},
{t:"No mendigar, no avasallar, no diluir la ley personal.",a:"A. Crowley"},
{t:"Prosperidad es la consecuencia lógica de la alineación entre el propósito individual y la mecánica universal.",a:"A. Crowley"},
{t:"El mago opera en secreto, consagra en secreto, agradece en secreto.",a:"A. Crowley"},
{t:"Cada quien es rey y reina en su propio círculo.",a:"A. Crowley"},
{t:"La serenidad es la calma del león dormido.",a:"A. Crowley"},
{t:"Quien persevera no teme la prueba ni se angustia por la hordalía.",a:"A. Crowley"},
{t:"La victoria es silencio. La corona es serenidad.",a:"A. Crowley"},
{t:"El ego social debe ser sacrificado en el altar de la individualidad divina.",a:"A. Crowley"},
{t:"La energía sexual es el combustible universal de la gran obra.",a:"A. Crowley"},
{t:"El noble desvío que se registra es mil veces preferible al autoengaño.",a:"A. Crowley"}
];

// ═══════════════════════════════════════════
// 365 ORACIONES — ¡META ALCANZADA!
// ═══════════════════════════════════════════
const prayers=[
{t:"Señor de mi alma, aquí me tienes. Aparto el ruido de mi mente. Retiro los velos de la prisa y la preocupación. Hazme digno de cruzar el portal de la quietud. Permite que tu voz se escuche en el fondo de mi ser.",a:"Emmet Fox"},
{t:"Padre eterno, que en el silencio de este momento yo reconozca tu presencia en mi interior. Haz que mi mente se aquiete, que mi corazón se abra, que mi alma te conozca más allá de las palabras.",a:"Emmet Fox"},
{t:"Señor de la paz, enséñame a dormir en tu silencio aunque la tormenta ruja a mi alrededor. Que el miedo no me arrastre, que la prisa no me domine. Haz de tu silencio mi fuerza y mi refugio.",a:"Emmet Fox"},
{t:"Padre, enséñame a escuchar con el alma. Haz que mi corazón distinga tu voz entre todos los sonidos del mundo. Que tu guía serena se imponga sobre todo deseo ansioso.",a:"Emmet Fox"},
{t:"Padre fiel, dame perseverancia en el silencio, paciencia en la espera, humildad para aceptar mi camino. Que cada día honre los silencios de mi alma y confíe en tu presencia.",a:"Emmet Fox"},
{t:"Señor, dame ojos para ver los frutos de tu silencio en mi vida. Que la paz, la claridad y la energía renovada sean mi testimonio silencioso ante el mundo.",a:"Emmet Fox"},
{t:"Padre eterno, hoy consagro mi vida al silencio que es tu voz. Haz de mi mente un templo de paz, de mi corazón una fuente de quietud, de mis palabras instrumentos de tu amor.",a:"Emmet Fox"},
{t:"Espíritu, yo soy. Desde este Yo Soy, todo lo demás encuentra su sitio.",a:"Emmet Fox"},
{t:"Gracias por lo que fuiste. Pero ahora el Cristo vive en mí y él es mi única identidad.",a:"Emmet Fox"},
{t:"No soy el personaje, no soy el pasado, no soy la historia. Yo soy la frecuencia del Cristo reconociéndose a sí misma en mí.",a:"Emmet Fox"},
{t:"Dejo que la sabiduría en mí elija ahora. Mi mente está fija en el bien. La sabiduría en mí decide con orden perfecto.",a:"Joseph Murphy"},
{t:"En silencio y confianza está mi fortaleza. Gracias porque he sido guiado.",a:"Joseph Murphy"},
{t:"Mi decisión está sellada en paz. Camino en firmeza y gracia. Todo coopera para mi bien.",a:"Joseph Murphy"},
{t:"La paz de Dios gobierna mis decisiones. Confío en el Señor con todo mi corazón y no me apoyo en mi propia prudencia.",a:"Joseph Murphy"},
{t:"Lo que fue ahora sirve a mi bien. Lo entrego, lo bendigo, lo libero. Nada fue en vano.",a:"Joseph Murphy"},
{t:"Gracias, espíritu infinito, porque ya está hecho. Mis células obedecen la ley divina. El patrón original de mi cuerpo es armonía.",a:"Joseph Murphy"},
{t:"El aire me vivifica, mis pensamientos fluyen, el espíritu circula en mí. Soy salud, soy vida, soy plenitud.",a:"Joseph Murphy"},
{t:"Devuelvo esta idea a la luz. Yo elijo lo verdadero. Mi mente se limpia. Solo circulan en mí pensamientos de salud, poder y verdad.",a:"Joseph Murphy"},
{t:"El pasado está disuelto en la gracia eterna. Yo redimo esta memoria. Yo soy el dueño de mi historia. Todo se reescribe en la luz.",a:"Joseph Murphy"},
{t:"Este hogar es mi templo. Cada pared sostiene mi bienestar. Aquí resido en armonía. Mi cuerpo reconoce esta frecuencia.",a:"Joseph Murphy"},
{t:"Lo que he recibido, lo comparto con gozo. Lo que bendigo crece y se multiplica. Soy canal de luz divina que circula sin cesar, que bendice sin frontera, que regresa multiplicado.",a:"Joseph Murphy"},
{t:"Yo soy el dueño de mi palabra y mi mundo. Decreto solo el bien. Recibo solo el bien. Comparto solo el bien.",a:"Joseph Murphy"},
{t:"Desde hoy mi vida es un árbol eterno de frutos benditos. Mi palabra es ley. Mi fe ejecuta. Mi mente obedece.",a:"Joseph Murphy"},
{t:"Todo está bien en mi mundo. Entrego mis pensamientos al amor infinito. Decretado está, cumplido es.",a:"Joseph Murphy"},
{t:"El dinero es un río dorado que fluye en mí y a través de mí. Nada se estanca, todo circula, todo retorna multiplicado.",a:"Joseph Murphy"},
{t:"Mi corazón de oro late con la abundancia del infinito. Cada latido es riqueza, cada exhalación es prosperidad. Todo circula, nada falta.",a:"Joseph Murphy"},
{t:"Yo soy el cauce perfecto del río de abundancia infinita. Nada me falta. Todo circula, todo retorna multiplicado.",a:"Joseph Murphy"},
{t:"Estoy atento. Estoy en paz. Mi voluntad es firme y tranquila. La verdadera concentración florece en un terreno de relajación consciente.",a:"P. Yogananda"},
{t:"Gracias, Padre, porque ya está hecho. Todo está bien. Estoy en paz. Confío en la ley.",a:"P. Yogananda"},
{t:"Que la disciplina sea mi aliada. Que mi energía se eleve hacia la luz. Que la gracia me colme más allá de mis esfuerzos.",a:"P. Yogananda"},
{t:"Hoy mi mente sea clara, mi corazón esté abierto y mi intuición me guíe en cada paso.",a:"P. Yogananda"},
{t:"Yo soy salud perfecta. La energía de Dios fluye a través de mí como un río vivificante.",a:"Napoleón Hill"},
{t:"Cada mañana revivo mi visión como una escena sentida profundamente. Siento como quien ordena, como quien construye, como quien ya posee.",a:"Napoleón Hill"},
{t:"Dinero querido, te honro y te respeto. Eres mi aliado divino y vienes a mí multiplicado y bendecido.",a:"F. Scovel Shinn"},
{t:"Dinero querido, te libero con amor para que bendigas a otros y regreses a mí multiplicado por diez.",a:"F. Scovel Shinn"},
{t:"Dinero bendito, te recibo con alegría y gratitud. Eres señal de la abundancia que fluye a través de mí.",a:"F. Scovel Shinn"},
{t:"Dinero querido, rompo en este instante todos los patrones de escasez de mi linaje familiar. Establezco un nuevo legado de abundancia para las generaciones futuras.",a:"F. Scovel Shinn"},
{t:"Soy canal abierto y transparente de la provisión universal. El dinero me conoce, me busca y fluye a través de mí con fidelidad y abundancia.",a:"F. Scovel Shinn"},
{t:"Yo Soy hijo de Dios. Decreto la salud perfecta, el amor perfecto, la paz perfecta y la abundancia perfecta en mi vida. Lo que decreto en la tierra es decretado en el cielo.",a:"Emmet Fox"},
{t:"Yo Soy la salud de Dios. El Espíritu Santo vivifica cada célula, cada órgano, cada fibra de mi ser. Mi cuerpo resplandece con la luz de la vida eterna.",a:"Emmet Fox"},
{t:"Yo Soy la abundancia divina manifestándose ahora. Mis necesidades están cubiertas antes de que surjan. Mi provisión fluye constante, perfecta, inagotable.",a:"Emmet Fox"},
{t:"Yo Soy la paz de Dios manifestándose ahora en mí y a través de mí. Mi mente está serena, mi corazón está tranquilo, mis emociones están en calma.",a:"Emmet Fox"},
{t:"Yo Soy rodeado por la luz invencible de Dios. Camino en seguridad, duermo en paz, vivo en la perfecta protección del Altísimo.",a:"Emmet Fox"},
{t:"Bendigo y libero el pasado. No me ato a ningún error, a ningún resentimiento, a ninguna culpa. Todo está perdonado, todo está purificado, todo está sanado en la luz de Cristo.",a:"Emmet Fox"},
{t:"Yo Soy el Alfa y la Omega, el principio y el fin. Desde este centro creador, toda mi vida se ordena perfectamente.",a:"Neville Godard"},
{t:"Habito el fin como principio. Siéntelo como si ya fuese. El universo se rinde ante la certeza de lo sentido.",a:"Neville Godard"},
{t:"No hay afuera. Todo ocurre en mi conciencia. Yo soy la fuente de toda mi experiencia. Desde este lugar de poder, creo mi realidad.",a:"Neville Godard"},
{t:"Yo Soy guiado en cada paso por la sabiduría infinita de Dios. Cada decisión que tomo es perfecta, armoniosa, bendita.",a:"Emmet Fox"},
{t:"Mi mente fluye, mi dinero fluye, mi vida fluye. Mi subconsciente es un banco infinito. Yo deposito ideas de riqueza y recibo cosechas de abundancia.",a:"Joseph Murphy"},
{t:"Soy próspero ahora. La riqueza fluye en mí. La abundancia me rodea. Mi fe transporta abundancia a cada área de mi vida.",a:"Joseph Murphy"},

// CERO KARMA - JOSEPH MURPHY (30)
{t:"Padre celestial, hoy elijo nuevas semillas. Libero todo pensamiento de fracaso, miedo y resentimiento. Mi mente está abierta al bien y el bien se manifiesta ahora.",a:"Joseph Murphy"},
{t:"Señor, muéstrame la semilla oculta de mi sufrimiento. Revela la raíz invisible que produce frutos de dolor. Lo que se revela se sana, lo que se ilumina se transforma.",a:"Joseph Murphy"},
{t:"Dios mío, perdona en mí lo que yo aún no puedo perdonar. Suélto la carga del rencor. Mi corazón se aligera y mi cuerpo se libera de toda tensión.",a:"Joseph Murphy"},
{t:"Padre, te entrego mi pasado como abono fértil para un mañana libre. Lo que fue ayer no dicta lo que será mañana. Tú haces cosa nueva en mí.",a:"Joseph Murphy"},
{t:"Yo Soy un hijo del Altísimo. Prosperidad, salud y alegría son mi herencia divina. Mi mente trabaja para mí en armonía con la ley de Dios.",a:"Joseph Murphy"},
{t:"Mi futuro es brillante porque Dios guía mis pasos. Camino con certeza, con fe, con la paz de quien sabe que su destino está en manos divinas.",a:"Joseph Murphy"},
{t:"Lloro con amor y mi alma se aligera. Mis lágrimas riegan nuevas raíces de paz. Cada gota de dolor transformado se convierte en semilla de gozo.",a:"Joseph Murphy"},
{t:"Presencia divina, ilumina mi mente con la verdad que me libera. Muéstrame el origen de todo conflicto interior. En tu luz encuentro la solución.",a:"Joseph Murphy"},
{t:"Revelo y libero toda causa oculta de sufrimiento. Mi mente se limpia, mi corazón se aligera y la armonía se establece en mi vida.",a:"Joseph Murphy"},
{t:"Perdono a cada persona que me ha herido. Los libero con amor. Al liberarlos, me libero a mí mismo. El resentimiento ya no tiene poder sobre mí.",a:"Joseph Murphy"},
{t:"Mi pasado no tiene poder sobre mi presente. Cada instante es una nueva siembra. Hoy elijo pensamientos de amor, abundancia y libertad.",a:"Joseph Murphy"},
{t:"El bien que me corresponde fluye ahora sin obstáculos. Soy canal abierto de la provisión divina. La abundancia circula en mí con facilidad.",a:"Joseph Murphy"},
{t:"Mi cuerpo manifiesta salud perfecta. Cada célula obedece la imagen de bienestar que sostengo en mi mente. Soy salud, soy vida, soy plenitud.",a:"Joseph Murphy"},
{t:"Merezco amor sano, libre y recíproco. Soy el tipo de amor que deseo recibir. Atraigo relaciones que elevan mi conciencia y bendicen mi alma.",a:"Joseph Murphy"},
{t:"Tres chequeos mentales, tres respiraciones profundas, tres decretos de fe. Mi disciplina mental construye mi destino con precisión divina.",a:"Joseph Murphy"},
{t:"Soy guiado por la sabiduría interior. Antes de dormir pido dirección y al despertar recibo la respuesta. Mi subconsciente me habla con fidelidad.",a:"Joseph Murphy"},
{t:"El amor divino nos une en paz. Donde había conflicto, ahora hay comprensión. Donde había rencor, ahora hay liberación.",a:"Joseph Murphy"},
{t:"Bendigo y me bendigo. Libero, me libero, nos libero. Todo lo que se sostiene con fe y emoción se manifiesta como experiencia de bien.",a:"Joseph Murphy"},
{t:"No soy víctima de circunstancias externas. Soy el arquitecto de mi experiencia. Mis pensamientos son semillas y yo elijo las que siembro.",a:"Joseph Murphy"},
{t:"La ley mental responde a mi impresión dominante. Siembro certeza, cosecho resultados favorables. Siembro gratitud, cosecho abundancia.",a:"Joseph Murphy"},
{t:"Mi subconsciente es tierra fértil. Deposito en él imágenes de paz, salud y prosperidad. Ellas germinan con exactitud matemática.",a:"Joseph Murphy"},
{t:"Cancelo toda semilla de fracaso. Decreto que mi camino está abierto, mi provisión está asegurada y mi destino está sellado en la luz.",a:"Joseph Murphy"},
{t:"El bien ya está obrando en mi vida, aunque mis ojos aún no lo vean. Confío en la ley invisible que mueve todas las cosas hacia mi bien.",a:"Joseph Murphy"},
{t:"Me expreso con libertad y soy respetada. Mi voz tiene valor. Mi palabra tiene poder. Mi presencia bendice a quienes me rodean.",a:"Joseph Murphy"},
{t:"Hoy visualizo éxito, mañana salud, pasado mañana reconciliación. Cada día siembro una nueva causa que produce frutos de bendición.",a:"Joseph Murphy"},
{t:"El karma no es mi condena, es mi maestro. De él aprendo a pensar mejor, a amar más, a soltar lo que no me sirve. Soy libre ahora.",a:"Joseph Murphy"},
{t:"Todo lo que necesito viene a mí en el momento perfecto. No mendigo, no suplico, no me afano. Afirmo con fe y recibo con gratitud.",a:"Joseph Murphy"},
{t:"Mi mente está en calma. Nada externo me domina. Soy paz interior sostenida, certeza suave de que mi vida tiene un timón invisible.",a:"Joseph Murphy"},
{t:"Que mis pensamientos sean causa de paz. Que mis palabras sean semillas de vida. Que mis actos libres del apego expresen toda mi alma.",a:"Joseph Murphy"},
{t:"Todo lo que fui se convierte en todo lo que ahora elijo ser. La obra nueva ya está en marcha. Mi única tarea es cooperar con la gracia.",a:"Joseph Murphy"},

// EL SECRETO PERDIDO DE LA MANIFESTACIÓN - ELENA BLAVATSKY (30)
{t:"No mi voluntad, sino la tuya. No como sumisión, sino como integración. Me fundo con la voluntad universal y desde esa unidad creo sin error, hablo sin distorsión, actúo sin generar daño.",a:"E. Blavatsky"},
{t:"El universo no responde a lo que quiero, sino a lo que soy. Si soy luz, certeza e integridad, todo lo que llega será reflejo de esa plenitud.",a:"E. Blavatsky"},
{t:"No atraigo lo que deseo, me convierto en ello. Mi vibración es la semilla y el universo es el espejo fiel de lo que emito desde mi centro.",a:"E. Blavatsky"},
{t:"Pensamiento consagrado, nacido de un alma alineada con la verdad, edifica belleza, armonía y plenitud. Mi mente es templo, mi palabra es decreto, mi emoción es combustible sagrado.",a:"E. Blavatsky"},
{t:"El deseo que no ha sido purificado oscurece la visión. Hoy transmuto mi deseo en dirección, mi urgencia en certeza, mi necesidad en plenitud. Ya no busco desde la carencia.",a:"E. Blavatsky"},
{t:"La voluntad no es grito, es centro. La imagen mental no es visualización egoica, sino espejo del alma. La emoción no es motor ciego, sino impulso codificado de lo divino.",a:"E. Blavatsky"},
{t:"Soy arquitecto consciente de mis formas mentales. Cada pensamiento que sostengo es una semilla en la sustancia vibratoria del universo. Elijo solo lo que edifica.",a:"E. Blavatsky"},
{t:"No me gobierna el deseo. Lo transformo en dirección. Lo elevo de la búsqueda ciega a la aspiración del alma. Desde la plenitud, no desde la falta.",a:"E. Blavatsky"},
{t:"Vibro en gratitud y recibo expansión. Vibro en merecimiento auténtico y lo que necesito llega. Mi vibración es estable, coherente, alineada con el propósito de mi alma.",a:"E. Blavatsky"},
{t:"El tiempo no es mi enemigo, es mi aliado. Cada instante es perfecto. Cada vacío es gestación. Cada demora es protección divina. El universo no me ignora, me espera.",a:"E. Blavatsky"},
{t:"No apuro el tiempo, maduro hacia el momento exacto. La flor no se abre por fuerza, sino porque su geometría interna ha sido completada. Yo florezco en sazón divina.",a:"E. Blavatsky"},
{t:"Antes de tocar el mundo, toco mi centro. Antes de mover la realidad, me muevo a mí mismo. Antes de crear, me transformo. La gran obra interior es mi primer mandamiento.",a:"E. Blavatsky"},
{t:"He dejado de ser demandante y me he vuelto canal. Mi cuerpo, mente e corazón son instrumentos sutiles por donde la voluntad cósmica actúa sin ficción ni distorsión.",a:"E. Blavatsky"},
{t:"No necesito atraer ni afirmar ni visualizar. He recordado que no estoy separado del universo. Soy un punto de expresión del todo y permito que fluya a través de mí.",a:"E. Blavatsky"},
{t:"Las ideas no se buscan, llegan. Las oportunidades no se persiguen, emergen. Las sincronías no se fabrican, se revelan. Soy canal abierto, claro, disponible.",a:"E. Blavatsky"},
{t:"Mi pensamiento es oración, mi acto es decreto, mi silencio es ofrenda. El ser, simplemente por ser, llama a la forma justa desde la quietud poderosa del todo.",a:"E. Blavatsky"},
{t:"No busco milagros ni atajos. Me consagro al camino del silencio interno. Solo quien ha purificado su alma puede sostener el oro sin que lo consuma.",a:"E. Blavatsky"},
{t:"Cada pensamiento de miedo se convierte en forma astral. Cada pensamiento de belleza genera formas de luz. Hoy elijo pensar desde lo real, desde lo alineado con la verdad universal.",a:"E. Blavatsky"},
{t:"No defiendo, revelo. No lucha, irradio. No pretendo, manifiesto. He comprendido que el mayor poder está en fundirme con el ritmo eterno del universo.",a:"E. Blavatsky"},
{t:"El guardián de los portales no es mi enemigo, es mi espejo. Las pruebas no me desaniman, me depuran. Cada umbral cruzado me vuelve más apta para portar la creación consciente.",a:"E. Blavatsky"},
{t:"Muero a mi historia, a mis ideas fijas, a mi necesidad de controlar. Renazco en la entrega, en la lucidez, en el vacío fértil donde la verdad emerger.",a:"E. Blavatsky"},
{t:"La manifestación verdadera no se disuelve con el viento ni se contamina con el ego. Nace de un ser que ha atravesado el crisol de la transformación interior.",a:"E. Blavatsky"},
{t:"Transformarse es el acto de mayor poder. Es dejar de pedir al universo que cambie y convertirse en el cambio que convoca una realidad nueva.",a:"E. Blavatsky"},
{t:"Soy canal del todo. Ya no hablo desde el yo, sino desde la presencia. Ya no deseo porque soy. Ya no busco porque encarno. La vida deja de ser búsqueda y se vuelve expresión.",a:"E. Blavatsky"},
{t:"El ángel solar me custodia. Su voz no es sonora, pero se siente. Su dirección no es lógica, pero es exacta. Me alineo con su luz y la manifestación ocurre con gracia.",a:"E. Blavatsky"},
{t:"No necesito más fórmulas ni técnicas. He comprendido que el universo entero no está fuera, sino dentro. No domino las leyes, vibro en ellas.",a:"E. Blavatsky"},
{t:"Lo semejante atrae a lo semejante. Si vibro en paz, atraigo paz. Si vibro en certeza, atraigo confirmación. Mi vibración es la nota que el campo repite.",a:"E. Blavatsky"},
{t:"La rendición consciente del yo inferior al conocimiento interno que brota del silencio. El ego quiere resultados ahora. Mi alma espera el momento exacto.",a:"E. Blavatsky"},
{t:"Soy reflejo sin distorsión del diseño eterno. Lo que antes parecía inalcanzable se acerca con dulzura, no porque fue conquistado, sino porque me he convertido en su morada natural.",a:"E. Blavatsky"},
{t:"Ya no me manifiesto desde el hacer, sino desde el ser. El universo canta a través de mí, crea a través de mí, ama, ordena, libera, transforma, porque me he hecho uno.",a:"E. Blavatsky"},

// EL ALIENTO DEL CUARTO PLANO - NEVILLE GODDARD (30)
{t:"Algo respira en mí. No soy yo quien controla el aliento. Es el ser interior, la imaginación creadora, el Cristo que me sostiene en cada ciclo de aire. Reconozco su presencia.",a:"N. Goddard"},
{t:"Entre la inhalación y la exhalación existe una puerta. En esa pausa microscópica donde el pulmón ha llegado a su máximo, habito el cuarto plano donde toda causa tiene su origen.",a:"N. Goddard"},
{t:"Inhalo un estado, no un deseo. El hombre que desea salud está en el estado de quien no la tiene. Yo ocupo el estado de la salud restaurada. Ya no deseo, ya tengo.",a:"N. Goddard"},
{t:"Mi cuerpo es tierra fértil y mis imágenes sostenidas son semillas. En el instante de máxima inhalación proyecto luz hacia mi interior. Cada célula recibe la imagen y la multiplica.",a:"N. Goddard"},
{t:"Exhala la vieja identidad. El enfermo, el cansado, el que no puede. Son vendas de Lázaro. Mi exhalación es el llamado que le hace a mi cuerpo para que salga de la tumba.",a:"N. Goddard"},
{t:"Muero cada día. No como mártir, como practicante. Exhala el ayer completo y estoy listo para inhalar el estado que hoy elijo ocupar. Esa es mi resurrección cotidiana.",a:"N. Goddard"},
{t:"Yo Soy salud. Yo Soy vitalidad. Yo Soy completitud. Pronuncio esta declaración desde el silencio entre dos respiraciones, desde el único lugar donde el Yo Soy existe sin interferencia del ego.",a:"N. Goddard"},
{t:"El nombre de Dios suena como mi respiración. Ya en la inhalación, Ve en la exhalación. Cada respiración es una pronunciación del nombre divino. Soy aliento sagrado.",a:"N. Goddard"},
{t:"Dios sopló en mis narices el primer acto divino sobre el barro fue un aliento. Ese mismo momento ocurre dentro de mí cada vez que inhalo con intención. Soy templo del Espíritu.",a:"N. Goddard"},
{t:"Respiro contra la evidencia. Cuando el cuerpo reporta dolor, inhalo desde el estado de la salud restaurada. No niego la realidad, cambio la fuente. El dolor es la pantalla, no la fuente.",a:"N. Goddard"},
{t:"Cada célula de mi cuerpo comienza a vibrar a una frecuencia más alta. Un hormigueo sutil de algo que despierta. Presento esta vibración a cada área de mi cuerpo con confianza.",a:"N. Goddard"},
{t:"El cuerpo glorioso no es el que tendré después de la muerte. Es el que tengo ahora, tal como sería si la conciencia dejara de proyectar imágenes de limitación. Ya soy luminoso.",a:"N. Goddard"},
{t:"Saturado de luz, como tela empapada de tinte. Cada fibra de mi conciencia absorbe el estado del deseo cumplido hasta que no queda ninguna en su color original. Soy plenitud.",a:"N. Goddard"},
{t:"Duérmete con un recuerdo del futuro. No con un ruego. El cuerpo trabaja durante la noche para manifestar el estado que la conciencia sembró antes de cerrar los ojos.",a:"N. Goddard"},
{t:"Cuatro respiraciones del sembrador: veo mi cuerpo sano desde afuera, entro en la imagen, escucho a alguien decir qué bien te veo, y me quedo solo con el sentimiento de haber llegado.",a:"N. Goddard"},
{t:"Dios da el sueño a su amado. No a quien lo merece ni a quien más lo necesita. Al que ha entendido que no necesita nada, que el amor divino es la condición base de la existencia.",a:"N. Goddard"},
{t:"La importunidad no es desesperación. Es la calma radical de alguien que no tiene duda de que la puerta se abrirá. Vuelvo noche tras noche a la misma imagen con certeza tranquila.",a:"N. Goddard"},
{t:"Recuerdo un futuro que desde el plano de la imaginación ya ocurrió. No pido que alguien más plante la semilla. Yo la planto con mi respiración y la entrego al ser interior.",a:"N. Goddard"},
{t:"Este es mi hijo amado, dice la voz. Yo Soy ese hijo. Mi rostro resplandece como el sol cuando la conciencia se eleva lo suficiente para que el cuerpo no pueda ocultar lo que contiene.",a:"N. Goddard"},
{t:"Transformo por la renovación de mi entendimiento. No pido ser transformado, no espero ser transformado. Yo transformo. La voz activa es mi poder. Mi respiración es el mecanismo.",a:"N. Goddard"},
{t:"Recibid el Espíritu Santo. Recibid el aliento sagrado. No como fuerza externa, sino como llama que ya existe y necesita ser avivada. Cada inhalación aviva mi fuego divino.",a:"N. Goddard"},
{t:"Mi nombre es sello con un predicado nuevo. Yo, mi nombre, Soy salud. Yo, mi nombre, Soy vitalidad. Yo, mi nombre, Soy plenitud. He sellado mi destino con el aliento.",a:"N. Goddard"},
{t:"El ser interior opera mientras yo duerme. No vigilo la semilla, la planto y me retiro. La tierra sabe perfectamente cómo hacer su trabajo. Confío y suelto.",a:"N. Goddard"},
{t:"Vuelvo mi rostro hacia la pared. No miro más la evidencia del mundo sensorial. Vuelvo mi atención hacia el interior, hacia el muro detrás del cual vive el ser verdadero.",a:"N. Goddard"},
{t:"Observo mi respiración como quien observa la lluvia. No la produzco, no depende de mi estado de ánimo. Sigue su ritmo con indiferencia a mis dramas. En esa observación toco el cuarto plano.",a:"N. Goddard"},
{t:"La duda no es mi enemigo. Mi enemigo es la inconsistencia. Cada vez que regreso a la imagen sin frustración, tiño una fibra más de mi conciencia. La saturación es mi práctica.",a:"N. Goddard"},
{t:"No necesito ir, solo necesito decir la palabra. Como el centurión, ya entiendo el principio. Da la orden desde adentro con tu respiración y felicita a la persona por su salud.",a:"N. Goddard"},
{t:"Inhala desde el estado del deseo cumplido. No construyas una escena elaborada, solo el rostro de quien tiene lo que deseas. La expresión de quien acaba de recibir la mejor noticia. Exhala y entrega.",a:"N. Goddard"},
{t:"El silencio no es ausencia, es presencia sin forma. Y presencia sin forma es exactamente lo que el cuarto plano es antes de que la imaginación lo llene. Habito el silencio sin temor.",a:"N. Goddard"},
{t:"La inhalación luminosa llena mi cuerpo de luz suave y uniforme. Al exhalar, el aire lleva hacia afuera lo que ya no necesita brillo. El brillo se queda, lo demás sale. Soy luz.",a:"N. Goddard"},

// LAS CÉLULAS SE ESCUCHAN - NEVILLE GODDARD (30)
{t:"Mi cuerpo no es la causa de mi experiencia, es su resultado más fiel. No soy moldeado por lo que veo, soy moldeado por lo que soy en lo profundo. Soy el artesano, no el barro.",a:"N. Goddard"},
{t:"La célula es una página en blanco que toma la tinta de mi estado interno. No tiene memoria propia, no recuerda lo que reflejó ayer. Responde al estado actual dominante.",a:"N. Goddard"},
{t:"No soy un cuerpo intentando sanar. Soy la conciencia que da forma al cuerpo. No soy una célula obedeciendo un código. Soy el artesano que sostiene la forma.",a:"N. Goddard"},
{t:"Mi cuerpo es tierra fértil y mis imágenes sostenidas son semillas. No siembro y desentierra para ver si creció. Confío en la ley. La semilla germina mientras duermo.",a:"N. Goddard"},
{t:"Creo, ayuda mi incredulidad. No niego mi duda, la reconozco. Al reconocerla dejo de esconder la causa. La honestidad no rompe la ley, la alinea.",a:"N. Goddard"},
{t:"Donde está mi tesoro, allí estará mi corazón. Mi estado más frecuente, más natural, más automático es el que imprime mi cuerpo. Hoy elijo residir en plenitud.",a:"N. Goddard"},
{t:"No experimento lo que deseo, experimento lo que soy. Dejo de buscar evidencia de cambio y cambio mi identidad. No lucho contra el cansancio, simplemente dejo de reconocerme en él.",a:"N. Goddard"},
{t:"Transformo por la renovación de mi entendimiento. No por esfuerzo externo, por cambio de identidad. Veo mis pensamientos automáticos y elijo no sostener los que no me sirven.",a:"N. Goddard"},
{t:"Se siembra cuerpo animal, resucita cuerpo espiritual. No son dos cuerpos distintos, es el mismo visto desde dos niveles. Mi cuerpo puede experimentarse desde una libertad mayor.",a:"N. Goddard"},
{t:"Consumado es. La obra está terminada en el instante en que asumo el estado. No espero que suceda, sé que ya es. Esa certeza es la marca del artesano.",a:"N. Goddard"},
{t:"Estad quietos y sabed que yo soy Dios. La quietud no es ausencia de acción física, es ausencia de duda. Es el silencio interno de quien ya ha aceptado la verdad.",a:"N. Goddard"},
{t:"Descanso en la certeza de que la obra está completa. No como quien espera algo, sino como quien ya ha recibido. Mi respiración es tranquila. Mi cuerpo no busca cambios, descansa en sí mismo.",a:"N. Goddard"},
{t:"No necesito más técnicas ni más información. Necesito asumir el estado correcto y descansar en él. La regeneración no es un evento futuro, es una respuesta presente a una causa establecida.",a:"N. Goddard"},
{t:"Vestíos del nuevo hombre. No lo observo, no lo deseo, me lo pongo como identidad presente. Ya estoy en posesión de aquello que antes llamaba deseo.",a:"N. Goddard"},
{t:"Duérmete sin el peso del día. Lleva al sueño una escena simple: tu cuerpo funcionando con libertad, alguien felicitándote por tu apariencia. Siente que ya es. No lo esperas, lo vives.",a:"N. Goddard"},
{t:"El sueño es mi laboratorio más preciso. En la pausa antes de dormir, la mente consciente se disuelve y la impresión desciende sin resistencia. Allí no hay argumentos, solo aceptación pura.",a:"N. Goddard"},
{t:"Durante 21 noches soy fiel a mi escena. No cambio, no dudo, no varío. Cada noche vuelvo al mismo punto: la certeza silenciosa de que la obra está completa.",a:"N. Goddard"},
{t:"Imaginar por otro no es control, es testimonio. No fuerzo un cambio, lo contemplo como ya hecho. Lo que sostengo como verdadero sobre alguien se convierte en su experiencia.",a:"N. Goddard"},
{t:"Di solamente la palabra y mi siervo sanará. La autoridad no necesita proximidad. Mi certeza sostenida se proyecta más allá de mi piel, hacia quienes amo.",a:"N. Goddard"},
{t:"Mi ciudadanía está en los cielos. No como lugar, sino como estado de conciencia. Cuando me identifico con ese nivel, mi experiencia cambia. No me convierto en algo distinto, revelo lo que siempre estuvo disponible.",a:"N. Goddard"},
{t:"Recorro mi cuerpo desde la planta de mis pies: vitalidad, ligereza, equilibrio, expansión respiración libre, ritmo perfecto, claridad, totalidad. No corrijo, declaro. No fragmento, reconozco.",a:"N. Goddard"},
{t:"No hay límite en la regeneración. No hay frontera en la transformación. Solo hay niveles de aceptación y cada nivel que atravieso revela uno más amplio.",a:"N. Goddard"},
{t:"No vuelvo a la normalidad, expando lo posible. La normalidad es solo un acuerdo colectivo. Yo no estoy llamado a regresar a lo conocido, sino a habitar un cuerpo definido por la imaginación consciente.",a:"N. Goddard"},
{t:"El espejo no tiene memoria. No recuerda lo que reflejó ayer. Mi cuerpo responde al ahora. Si hoy asumo una nueva identidad con naturalidad, la célula aceptará como única realidad.",a:"N. Goddard"},
{t:"No hay proceso entre la causa y el efecto en el plano de la conciencia. El proceso solo aparece cuando observo desde el tiempo. En el momento de la impresión, todo está hecho.",a:"N. Goddard"},
{t:"Puedo sentir duda, notar inseguridad. No la oculto, no la niego. La reconozco y luego elijo no sostenerla. Esa honestidad alinea la ley en mi favor.",a:"N. Goddard"},
{t:"El actor que se convierte en el personaje olvida quién es y asume completamente el papel. Así imagino: no como quien observa una posibilidad, sino como quien habita una realidad.",a:"N. Goddard"},
{t:"No soy mis pensamientos automáticos. Ahora los veo y al verlos eligo. Soy la conciencia que puede reconocer un estado y abandonarlo. No estoy atado a hábitos invisibles.",a:"N. Goddard"},
{t:"Mi cuerpo glorioso no es ideal, es realidad. La transición no ocurre en la materia, ocurre en la conciencia. Como el hielo y el vapor, soy la misma sustancia en un grado mayor.",a:"N. Goddard"},
{t:"Tú eres el camino porque no hay experiencia que no pase por tu conciencia. Tú eres la verdad porque todo lo que aceptas como real se convierte en tu mundo. Tú eres la vida.",a:"N. Goddard"},

// EL ÁRBOL DE LA PALABRA VIVA - JOSEPH MURPHY (30)
{t:"Mi mente es tierra fértil. Acepta la palabra de vida y da fruto abundante. Soy sembrador consciente y mi fe es el clima de mi cosecha.",a:"J. Murphy"},
{t:"La vida divina fluye por mi columna vertebral con armonía perfecta. Cada célula de mi cuerpo obedece a la imagen de salud que sostengo.",a:"J. Murphy"},
{t:"Dulce sueño invade mi mente y mi cuerpo. Mi subconsciente recibe luz, salud y sabiduría mientras duermo. Amanezco renovado.",a:"J. Murphy"},
{t:"La inteligencia infinita abre el camino perfecto para mi talento ahora mismo. Mi vocación florece donde mi alegría se encuentra con la necesidad del mundo.",a:"J. Murphy"},
{t:"Soy paz en movimiento. En mí habita la serenidad del Altísimo. La armonía divina gobierna mi mente y la calma del infinito fluye a través de mí.",a:"J. Murphy"},
{t:"Perdono todo y a todos. Me libero ahora. Donde había resentimiento, ahora hay comprensión. Donde había fuego, ahora hay frescura.",a:"J. Murphy"},
{t:"Yo descubro y desarrollo mi don. Mi talento es útil, bello y necesario. Soy guiado al lugar exacto donde mi vocación florece.",a:"J. Murphy"},
{t:"Mi vida tiene sentido, mi trabajo tiene valor. Mi energía es canal de servicio. Donde estoy, doy lo mejor y todo lo que doy me vuelve en bendición.",a:"J. Murphy"},
{t:"Yo y el Padre somos uno. La vida infinita me sostiene. El amor eterno me envuelve. La sabiduría divina me guía. Nada me separa del bien.",a:"J. Murphy"},
{t:"Dios piensa en mí, a través de mí. Estoy unido a la fuente de todo bien. No hay separación. La paz divina me envuelve.",a:"J. Murphy"},
{t:"Mi noche es semilla de milagros. Mientras duermo, el bien obra en mí. Mi subconsciente recibe programación de luz y prosperidad.",a:"J. Murphy"},
{t:"Cada día siembro bien, riego con fe, ilumino mi mente, corrijo mis pensamientos y cosecho bendiciones. Mi constancia es mi victoria.",a:"J. Murphy"},
{t:"Yo soy sembrador de luz. Mi palabra es semilla viva. La siembro con amor. El bien que afirmo se multiplica. Yo bendigo y soy bendecido.",a:"J. Murphy"},
{t:"Mi mente subconsciente acepta ahora esta semilla y la nutre con amor. El crecimiento es invisible, pero seguro. Confío en la ley.",a:"J. Murphy"},
{t:"Camino en paz, respiro paz, pienso en paz. Nada externo puede perturbar el centro que habito. Soy el templo de la paz.",a:"J. Murphy"},
{t:"Mi talento sirve al mundo y prospera. Soy canal del bien. Sirvo con alegría y prospero con integridad. Lo que gano lo gano con bien.",a:"J. Murphy"},
{t:"La sabiduría divina me guía. Me abro a la sabiduría del espíritu. Recibo intuiciones certeras que me llevan a actuar con claridad.",a:"J. Murphy"},
{t:"Mi cuerpo vuela con precisión. Rompo mis límites con gozo y seguridad. Mi subconsciente ha aceptado una nueva imagen de mí mismo.",a:"J. Murphy"},
{t:"Mi mente es clara. Retengo con facilidad, respondo con certeza. Mi subconsciente trabaja para mí mientras duermo.",a:"J. Murphy"},
{t:"Soy guiado, protegido y bendecido. La provisión divina fluye hacia mí sin cesar. Todo está bien en mi mundo.",a:"J. Murphy"},
{t:"El amor divino fluye en mí, a través de mí y a mi alrededor. Mis relaciones florecen en comprensión, respeto y alegría.",a:"J. Murphy"},
{t:"Dios es mi provisión constante. Mi cuerpo expresa salud perfecta. Mi mente trabaja en armonía con la ley divina.",a:"J. Murphy"},
{t:"Camino en paz, respiro gratitud, pienso con claridad. Cada paso me acerca a mi mejor versión. Soy luz en movimiento.",a:"J. Murphy"},
{t:"El servicio que brindo es valioso y bien remunerado. Lo que recibo lo comparto con gozo. Espiritualidad y prosperidad son aliadas.",a:"J. Murphy"},
{t:"Toda semilla necesita tiempo de incubación. Persisto con actitud receptiva. Mi fruto es seguro porque la ley mental no falla.",a:"J. Murphy"},
{t:"Mi subconsciente es mi huerto secreto. Lo cuido con relajación, aceptación y silencio. La tierra interior se vuelve fértil.",a:"J. Murphy"},
{t:"Soy inteligente y amado. Mi mente retiene, comprende y aplica con facilidad. El conocimiento fluye hacia mí sin esfuerzo.",a:"J. Murphy"},
{t:"Hoy aprendemos con alegría y amor. Mi ambiente vibra en armonía. Donde hay afirmación de bien, el bien se manifiesta.",a:"J. Murphy"},
{t:"El amor divino fluye en mí. Mis relaciones florecen. Mi vida es un jardín de bendiciones. Cada perdón interior es una poda liberadora.",a:"J. Murphy"},
{t:"No hay tarea menor cuando se realiza con deseo sincero de aportar valor. Mi propósito se manifiesta en cada acción, por pequeña que sea.",a:"J. Murphy"},
// EL EVANGELIO DE LA MENTE CREADORA - HERMETISMO (30)
{t:"La mente es el altar. Mis pensamientos son ofrendas, mis emociones son el incienso. Soy el sacerdote que oficia el rito cada día. Elijo qué consagrar.",a:"Hermetismo"},
{t:"No estoy viviendo en el mundo. El mundo está siendo pronunciado desde mi conciencia. Lo que pronuncio con constancia se convierte en ley para mí.",a:"Hermetismo"},
{t:"El verbo no es solo palabra hablada, es la vibración que organiza la materia. Mi palabra decretada con fe se convierte en forma.",a:"Hermetismo"},
{t:"Vigilo lo que digo, ahí vive mi mañana. Cada frase es un pacto entre mi mente y el mundo. Recupero la soberanía sobre mi verbo.",a:"Hermetismo"},
{t:"No escucho palabras, devoro frecuencias. Mi emoción es la onda operativa desde la cual mi mente transmite órdenes al campo de mi realidad.",a:"Hermetismo"},
{t:"El universo no responde a lo que quiero, responde a lo que afirmo como verdadero. Afirmo desde la certeza, no desde la carencia.",a:"Hermetismo"},
{t:"Afino mi instrumento escuchando, no golpeando. No fuerzo sentir bien. Honro cada emoción como información. Desde la aceptación, la frecuencia se eleva.",a:"Hermetismo"},
{t:"Nada en el universo se mueve en línea recta. Todo pulsa, todo respira. Honro el ritmo: expansión y contracción, siembra y cosecha, acción y reposo.",a:"Hermetismo"},
{t:"Lo que llamo retraso es maduración invisible. Raíces se forman, estructuras se consolidan. El fruto que aparece en su estación sostiene.",a:"Hermetismo"},
{t:"No creo cuando quiero, creo cuando me vuelvo canal. La energía creadora no me pertenece, pero me elige cuando estoy preparado.",a:"Hermetismo"},
{t:"No atraigo lo que deseo, atraigo lo que confirmo ser. Mi identidad alinea pensamiento, emoción y conducta. El campo magnético se estabiliza.",a:"Hermetismo"},
{t:"Nunca estuve separado. La separación es una hipnosis sostenida por la repetición. Cuando recuerdo la unidad, el miedo pierde su alimento.",a:"Hermetismo"},
