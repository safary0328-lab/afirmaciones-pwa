<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#1a1a2e">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">

<title>✨ Afirmaciones y Oraciones Diarias</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box}

:root{--text:#fff;--shadow:rgba(0,0,0,0.3);

--bg-gradient:linear-gradient(135deg,#0a0a2e 0%,#1a0a3e 50%,#0d1b2a 100%);

--card-bg:rgba(10,10,40,0.6);

--card-border:rgba(100,100,255,0.15);

--btn-bg:rgba(20,20,60,0.5);

--btn-border:rgba(100,100,255,0.25);

--btn-hover:rgba(255,255,255,0.25);

--accent-color:rgba(160,160,255,0.8);

--author-color:rgba(160,160,255,0.8);

--text-secondary:rgba(180,180,255,0.9);

--panel-bg:rgba(5,5,20,0.95);

--input-bg:rgba(15,15,40,0.8);

--input-border:rgba(100,100,255,0.2);

--input-text:rgba(200,200,255,0.95);

--toast-bg:rgba(15,15,40,0.85);

--toast-border:rgba(100,100,255,0.2);

--toast-text:rgba(200,200,255,0.95);

--star-color:255,255,255;

--glow-color:rgba(100,100,255,0.8);

}

html,body{height:100%;overflow:hidden;font-family:'Montserrat',sans-serif}

body{display:flex;flex-direction:column;align-items:center;justify-content:center;

background:linear-gradient(135deg,#0a0a2e 0%,#1a0a3e 50%,#0d1b2a 100%);

transition:background 1.5s ease;color:var(--text);text-align:center;padding:20px;position:relative}

/* Stars animation */

.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

.star{position:absolute;background:radial-gradient(circle,rgb(var(--star-color)) 0%,rgba(var(--star-color),0) 70%);border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite;box-shadow:0 0 6px 2px rgba(var(--star-color),0.3)}

@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}

/* Main content */

.container{position:relative;z-index:1;max-width:600px;width:100%;display:flex;flex-direction:column;align-items:center;gap:30px}

/* Header */

.header{display:flex;align-items:center;gap:10px;opacity:0.9}

.header h1{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;letter-spacing:2px;text-transform:uppercase}

/* Day counter */

.day-counter{font-size:0.85rem;opacity:0.85;letter-spacing:3px;font-weight:400;color:var(--text-secondary)}

/* Affirmation card */

.card{background:var(--card-bg);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);

border:1px solid var(--card-border);border-radius:24px;padding:40px 30px;

min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;

width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(var(--star-color),0.08);transition:all 0.5s ease;position:relative;overflow:hidden}

.card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;

background:radial-gradient(circle,rgba(var(--star-color),0.05) 0%,transparent 70%);

animation:shimmer 8s linear infinite}

@keyframes shimmer{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.affirmation-text{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;

line-height:1.7;letter-spacing:0.5px;position:relative;z-index:1;

text-shadow:0 2px 15px rgba(0,0,0,0.5),0 0 30px rgba(0,0,0,0.3);font-style:italic;color:var(--text)}

.affirmation-text::before{content:'"';font-size:3rem;opacity:0.3;position:absolute;

top:-20px;left:-10px;font-family:serif}

.author{font-size:0.75rem;opacity:0.7;margin-top:15px;letter-spacing:2px;font-weight:400;position:relative;z-index:1;color:var(--accent-color)}

/* Buttons */

.btn-row{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}

.btn{background:var(--btn-bg);border:1px solid var(--btn-border);

border-radius:50px;padding:12px 24px;color:var(--text);font-family:'Montserrat',sans-serif;

font-size:0.8rem;letter-spacing:1px;cursor:pointer;transition:all 0.3s ease;

backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px}

.btn:hover{background:var(--btn-hover);transform:translateY(-2px)}

.btn:active{transform:scale(0.95)}

.btn.active{background:var(--btn-hover);border-color:var(--glow-color)}

.btn-icon{font-size:1.1rem}

/* Settings panel */

.settings{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--panel-bg);

backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);z-index:100;

display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:20px}

.settings.show{display:flex}

.settings h2{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;margin-bottom:10px}

.settings-group{width:100%;max-width:400px;text-align:left}

.settings-group label{display:block;font-size:0.8rem;opacity:0.7;margin-bottom:5px;letter-spacing:1px}

.settings-group select,.settings-group input{width:100%;padding:12px;border-radius:12px;

border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-text);

font-family:'Montserrat',sans-serif;font-size:0.9rem;backdrop-filter:blur(10px)}

.settings-group input[type=time]{color-scheme:var(--color-scheme,dark)}

.close-btn{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--text);

font-size:2rem;cursor:pointer;opacity:0.7}

.close-btn:hover{opacity:1}

.notify-btn{background:var(--btn-bg);border:1px solid var(--btn-border);

border-radius:12px;padding:15px;color:var(--input-text);font-family:'Montserrat',sans-serif;

font-size:0.9rem;cursor:pointer;width:100%;max-width:400px;transition:all 0.3s}

.notify-btn:hover{background:var(--btn-hover)}

.notify-btn.granted{background:rgba(76,175,80,0.3);border-color:rgba(76,175,80,0.6)}

/* Notification toast */

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);

background:var(--toast-bg);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);

border:1px solid var(--toast-border);border-radius:16px

font-size:0.85rem;z-index:200;transition:transform 0.5s ease;max-width:90%;

color:var(--toast-text)}

.toast.show{transform:translateX(-50%) translateY(0)}

/* Swipe hint */

.swipe-hint{position:fixed;bottom:15px;font-size:0.7rem;opacity:0.4;letter-spacing:2px;z-index:1}

/* Fade animation */

.fade-in{animation:fadeIn 0.8s ease}

@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* TTS Button */

.btn-tts{background:var(--btn-bg);border:1px solid var(--btn-border);

border-radius:50px;padding:12px 24px;color:var(--text);font-family:'Montserrat',sans-serif;

font-size:0.8rem;letter-spacing:1px;cursor:pointer;transition:all 0.3s ease;

backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px}

.btn-tts:hover{background:var(--btn-hover);transform:translateY(-2px)}

.btn-tts:active{transform:scale(0.95)}

.btn-tts.speaking{background:var(--accent-color);border-color:var(--glow-color);

animation:pulse-glow 2s ease-in-out infinite}

/* Card speaking animation */

.card.speaking{animation:card-pulse 2s ease-in-out infinite;

box-shadow:0 0 30px rgba(100,100,255,0.3),0 8px 40px rgba(0,0,0,0.5)}

@keyframes card-pulse{

0%,100%{transform:scale(1);box-shadow:0 0 30px rgba(100,100,255,0.3),0 8px 40px rgba(0,0,0,0.5)}

50%{transform:scale(1.02);box-shadow:0 0 50px rgba(100,100,255,0.5),0 8px 40px rgba(0,0,0,0.5)}

}

@keyframes pulse-glow{

0%,100%{box-shadow:0 0 10px rgba(100,100,255,0.3)}

50%{box-shadow:0 0 20px rgba(100,100,255,0.6)}

}

/* Voice settings panel */

.voice-settings{margin-top:20px;padding-top:20px;border-top:1px solid var(--input-border)}

.voice-settings h3{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:300;

margin-bottom:15px;color:var(--accent-color)}

.voice-slider{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.voice-slider label{font-size:0.75rem;opacity:0.7;letter-spacing:1px;min-width:80px}

.voice-slider input[type=range]{flex:1;accent-color:var(--glow-color)}

.voice-slider .voice-value{font-size:0.75rem;opacity:0.7;min-width:40px;text-align:right}

.voice-warning{background:rgba(255,150,50,0.15);border:1px solid rgba(255,150,50,0.3);

border-radius:12px;padding:12px;font-size:0.8rem;color:rgba(255,200,150,0.9);

margin-top:10px;text-align:center}

/* Mejoras base para móvil */
*{
  -webkit-tap-highlight-color:transparent;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

/* Scroll suave */
.container{
  overflow-y:auto;
  max-height:100vh;
  padding-bottom:20px;
}

/* Botones más fáciles de tocar */
.btn{
  min-height:44px;
  min-width:44px;
}

/* Inputs más fáciles de tocar */
input, select, button{
  min-height:44px;
}

/* Responsive para móviles */
@media(max-width:480px){
  /* Contenedor principal */
  .container{
    gap:15px;
    padding:10px;
  }
  
  /* Header */
  .header h1{
    font-size:1rem;
    letter-spacing:1px;
  }
  
  /* Contador de día */
  .day-counter{
    font-size:0.75rem;
    letter-spacing:2px;
  }
  
  /* Card de afirmación */
  .card{
    padding:20px 15px;
    min-height:150px;
    border-radius:16px;
  }
  
  /* Texto de afirmación */
  .affirmation-text{
    font-size:1.1rem;
    line-height:1.5;
  }
  
  /* Autor */
  .author{
    font-size:0.7rem;
    margin-top:10px;
  }
  
  /* Filas de botones */
  .btn-row{
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  
  /* Botones individuales */
  .btn{
    padding:8px 14px;
    font-size:0.7rem;
    letter-spacing:0.5px;
  }
  
  /* Iconos de botones */
  .btn-icon{
    font-size:0.9rem;
  }
  
  /* Panel de configuración */
  .settings{
    padding:20px;
  }
  
  .settings h2{
    font-size:1.3rem;
  }
  
  /* Inputs en ajustes */
  .settings-group input,
  .settings-group select{
    padding:10px;
    font-size:0.85rem;
  }
  
  /* Botones de notificación */
  .notify-btn{
    padding:12px;
    font-size:0.85rem;
  }
  
  /* Panel de categorías */
  .categories-overlay{
    padding:20px;
  }
  
  .categories-overlay h2{
    font-size:1.3rem;
  }
  
  /* Botones de categoría */
  .cat-btn{
    padding:10px 12px;
    font-size:0.75rem;
  }
  
  /* Panel de música */
  .music-panel{
    padding:20px;
  }
  
  .music-panel h2{
    font-size:1.3rem;
  }
  
  /* Botones de sonido */
  .sound-btn{
    padding:10px;
  }
  
  .sound-emoji{
    font-size:1.2rem;
  }
  
  .sound-name{
    font-size:0.6rem;
  }
  
  /* Panel de temas */
  .theme-panel{
    padding:20px;
  }
  
  .theme-panel h2{
    font-size:1.3rem;
  }
  
  /* Botones de tema */
  .theme-btn{
    padding:15px;
  }
  
  .theme-emoji{
    font-size:1.5rem;
  }
  
  .theme-name{
    font-size:0.7rem;
  }
  
  /* Toast */
  .toast{
    bottom:20px;
    padding:12px 20px;
    font-size:0.8rem;
  }
  
  /* Share modal */
  .share-modal{
    padding:20px;
  }
  
  .share-modal h2{
    font-size:1.3rem;
  }
  
  /* Canvas de compartir */
  #shareCanvas{
    max-width:100%;
    height:auto;
  }
  
  /* Botones de compartir */
  .share-modal .btn{
    padding:10px 16px;
    font-size:0.8rem;
  }
  
  /* Hint de swipe */
  .swipe-hint{
    font-size:0.6rem;
    bottom:10px;
  }
  
  /* Control de volumen */
  .volume-row{
    flex-direction:column;
    gap:5px;
  }
  
  #volumeSlider{
    width:100px;
  }
}

/* Responsive para tablets */
@media(min-width:481px) and (max-width:768px){
  .container{
    max-width:500px;
    gap:20px;
  }
  
  .card{
    padding:35px 25px;
    min-height:220px;
  }
  
  .affirmation-text{
    font-size:1.4rem;
  }
}

/* Categories panel */

.categories-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--panel-bg);

backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);z-index:100;

display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:15px;overflow-y:auto}

.categories-overlay.show{display:flex}

.categories-overlay h2{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;margin-bottom:10px}

.cat-btn{background:var(--btn-bg);border:1px solid var(--btn-border);

border-radius:12px;padding:12px 20px;color:var(--input-text);font-family:'Montserrat',sans-serif;

font-size:0.75rem;letter-spacing:0.5px;cursor:pointer;transition:all 0.3s ease;

width:100%;max-width:420px;text-align:left;display:flex;justify-content:space-between;align-items:center}

.cat-btn:hover{background:var(--btn-hover);border-color:var(--glow-color);transform:translateX(5px)}

.cat-btn .cat-count{background:var(--btn-border);border-radius:20px;padding:2px 10px;font-size:0.65rem}

.cat-btn.active-cat{background:var(--accent-color);border-color:var(--glow-color)}

.cat-filter-bar{display:none;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;justify-content:center}

.cat-filter-bar.show{display:flex}

.cat-filter-label{font-size:0.7rem;opacity:0.7;letter-spacing:1px;background:var(--btn-bg);

border-radius:20px;padding:6px 14px;display:flex;align-items:center;gap:6px}

.cat-filter-label button{background:none;border:none;color:var(--text);cursor:pointer;font-size:1rem;padding:0;margin-left:4px}

.cat-filter-label button:hover{color:var(--text)}

/* Share image modal */

.share-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--panel-bg);

backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);z-index:150;

display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:20px}

.share-modal.show{display:flex}

.share-modal canvas{max-width:90vw;max-height:50vh;border-radius:16px;border:1px solid var(--card-border)}

.share-modal .share-actions{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}

/* Music Panel */

.music-panel{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--panel-bg);

backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);z-index:100;

display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:20px}

.music-panel.show{display:flex}

.music-panel h2{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;margin-bottom:5px}

.music-panel .now-playing{font-size:0.85rem;opacity:0.7;letter-spacing:1px;margin-bottom:10px;

color:var(--accent-color)}

.sound-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:360px}

.sound-btn{background:var(--btn-bg);border:1px solid var(--btn-border);

border-radius:14px;padding:14px 12px;color:var(--input-text);font-family:'Montserrat',sans-serif;

font-size:0.75rem;letter-spacing:0.5px;cursor:pointer;transition:all 0.3s ease;

display:flex;flex-direction:column;align-items:center;gap:6px}

.sound-btn:hover{background:var(--btn-hover);border-color:var(--glow-color);transform:translateY(-2px)}

.sound-btn.active{background:var(--accent-color);border-color:var(--glow-color)}

.sound-btn .sound-emoji{font-size:1.5rem}

.sound-btn .sound-name{font-size:0.7rem;letter-spacing:1px}

.music-controls{display:flex;align-items:center;gap:15px;margin-top:10px;width:100%;max-width:360px;justify-content:center}

.play-pause-btn{background:var(--btn-bg);border:1px solid var(--btn-border);

border-radius:50%;width:50px;height:50px;color:var(--text);font-size:1.3rem

transition:all 0.3s;display:flex;align-items:center;justify-content:center}

.play-pause-btn:hover{background:var(--btn-hover)}

.play-pause-btn.playing{background:var(--accent-color);border-color:var(--glow-color)}

.music-volume{display:flex;align-items:center;gap:10px;flex:1}

.music-volume span{font-size:0.8rem;opacity:0.7}

.music-volume input[type=range]{flex:1;accent-color:var(--glow-color)}

.mp3-btn{grid-column:span 2}

/* Theme Panel */

.theme-panel{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--panel-bg);

backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);z-index:100;

display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:20px}

.theme-panel.show{display:flex}

.theme-panel h2{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;margin-bottom:10px;color:var(--text)}

.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:360px}

.theme-btn{background:var(--btn-bg);border:2px solid var(--btn-border);

border-radius:16px;padding:18px 14px;color:var(--text);font-family:'Montserrat',sans-serif;

font-size:0.8rem;letter-spacing:0.5px;cursor:pointer;transition:all 0.3s ease;

display:flex;flex-direction:column;align-items:center;gap:8px}

.theme-btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,0.3)}

.theme-btn.active-theme{border-color:var(--glow-color);box-shadow:0 0 15px var(--accent-color)}

.theme-btn .theme-emoji{font-size:2rem}

.theme-btn .theme-name{font-size:0.75rem;letter-spacing:1px;font-weight:600}

.theme-btn .theme-preview{width:40px;height:40px;border-radius:10px;border:2px solid var(--btn-border)}

/* Mejoras de legibilidad para tema fotográfico */

body.theme-photo .affirmation-text{

  font-size:1.8rem;

  line-height:1.8;

  text-shadow:0 2px 15px rgba(0,0,0,0.8),0 0 30px rgba(0,0,0,0.5);

}

body.theme-photo .author{

  text-shadow:0 1px 5px rgba(0,0,0,0.5);

}

body.theme-photo .header h1{

  text-shadow:0 2px 10px rgba(0,0,0,0.5);

}

body.theme-photo .btn,

body.theme-photo .btn-tts{

  text-shadow:0 1px 3px rgba(0,0,0,0.5);

}

body.theme-photo .card{

  box-shadow:0 8px 40px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.05);

}

@media(max-width:480px){

  body.theme-photo .affirmation-text{font-size:1.4rem}

}

</style>

</head>

<body>

<div class="stars" id="stars"></div>

<div class="container">

  <div class="header">

    <span style="font-size:1.5rem">✨</span>

    <h1>✨ Afirmaciones y Oraciones</h1>

  </div>

  

  <div class="day-counter" id="dayCounter">DÍA 1 DE 539</div>

  

  <div class="card fade-in" id="card">

    <div class="affirmation-text" id="affirmation">Cargando...</div>

    <div class="author" id="author"></div>

  </div>

  

  <div class="btn-row">

    <button class="btn active" id="btnAffirm" onclick="setMode('affirm')"><span class="btn-icon">✨</span> Afirmaciones</button>

    <button class="btn" id="btnPrayer" onclick="setMode('prayer')"><span class="btn-icon">🙏</span> Oraciones</button>

  </div>

  

  <div class="btn-row">

    <button class="btn" onclick="prevDay()"><span class="btn-icon">◀</span> Anterior</button>

    <button class="btn" onclick="randomAffirmation()"><span class="btn-icon">🎲</span> Aleatorio</button>

    <button class="btn" onclick="nextDay()"><span class="btn-icon">▶</span> Siguiente</button>

  </div>

  

  <div class="btn-row">

    <button class="btn" onclick="toggleMusicPanel()" id="musicBtn"><span class="btn-icon">🎵</span> Música</button>

    <button class="btn" onclick="shareAffirmation()"><span class="btn-icon">📤</span> Compartir</button>

    <button class="btn-tts" id="ttsBtn" onclick="toggleTTS()"><span class="btn-icon">🔊</span> <span id="ttsLabel">Escuchar</span></button>

    <button class="btn" onclick="toggleCategories()" id="catBtn"><span class="btn-icon">🏷️</span> Categorías</button>

{t:"El pensamiento es energía en movimiento, vibración pura.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Todo pensamiento es una onda. Y toda onda genera una reacción.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Pensar sin emoción es soplar sobre brasas frías.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Desde ahora yo pienso lo que quiero pensar.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La mente no responde a impulsos ocasionales. Responde al mandato constante.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Quien piensa por hábito, repite lo viejo. Quien piensa por voluntad, crea lo nuevo.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Donde el ruido cesa, comienza la verdadera creación.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"El silencio no es vacío muerto, sino espacio fértil.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La emoción es el combustible del pensamiento creador.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Un pensamiento sin emoción es una semilla sin agua.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"El reino de los cielos está dentro de ti. Tu estado interior es el generador de tu mundo exterior.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La ley mental es exacta como la gravedad. No se altera por ruegos.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La realidad no ocurre. Se crea. Y el creador es siempre el pensamiento en acción.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La voluntad es el piloto. La imaginación es la nave.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"El entorno no causa el estado mental. El entorno es su proyección.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"No se necesita cambiar el mundo. Se necesita cambiar la conciencia que lo genera.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La mente es un canal que conecta el alma con la mente universal.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"El pensamiento con propósito, ritmo y dirección se convierte en destino.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"El pensador supremo no nace. Se revela.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"No necesitas poder. Ya lo eres.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Tu mente es templo, tu palabra es decreto, tu emoción es combustible.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Solo aquello a lo que prestamos atención adquiere poder en nuestra vida.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"El universo responde a lo que tú eres, no a lo que dices ser.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La concentración no es tensión. Es enfoque amoroso.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La visualización no es fantasía. Es arquitectura mental.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La imagen mental sostenida con fe es la semilla de la realidad futura.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La voluntad dirige, la imaginación modela. La realidad obedece.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Donde la voluntad y la imaginación trabajan como uno, allí la realidad se doblega.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"La mente que piensa así no es víctima de los hechos. Es autora de ellos.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

{t:"Cuando pienses en paz, el universo entero se abrirá ante ti.",a:"W.W. Atkinson","c":"W.W. ATKINSON - EL ARTE DE PENSAR CON PODER"},

// PARAMAHANSA YOGANANDA - LEY Y AMOR (28)

{t:"El hombre se convierte en aquello que medita constantemente.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"El aliento es la puerta maestra de la sanación.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La oración científica es el puente entre el deseo humano y la respuesta divina.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La intuición es la voz de Dios en el alma humana. Quien la sigue no hierra el camino.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La luz divina restaura y renueva cada célula de mi ser. Soy salud, soy vida, soy plenitud.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La disciplina es la guardiana de la libertad.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La gracia no anula el esfuerzo, sino que lo corona y lo trasciende.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La paz que no depende de las circunstancias brota de la conexión íntima con la fuente.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Todo lo que existe vibra.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"El AUM es la firma audible de la presencia divina.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Un pensamiento de amor eleva la vibración y predispone al entorno a responder con gracia.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La respiración profunda, pausada y consciente restaura la calma interior.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Afirmar no es negar la realidad, sino reeducar el subconsciente.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Agradece, confía y permanece en paz. La ley nunca falla.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La imaginación es el instrumento con el que el alma participa en la creación.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Todo lo que el corazón concibe con profundidad y sostiene con fe se hace carne.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La intuición no grita ni demanda. Susurra en lo profundo.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Cuando la mente se aquieta, la verdad se revela espontáneamente.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Si al pensar en una opción sientes paz, esa es la señal.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La prosperidad auténtica es la expansión natural de la utilidad y del gozo.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La generosidad auténtica no empobrece, sino que enriquece a quien la practica.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Busca primero la utilidad y el gozo, y todo lo demás vendrá por añadidura.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Las células del cuerpo obedecen las órdenes de la mente consciente.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Mi cuerpo descansa en la paz divina. La salud se restaura mientras duermo.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Los grandes cambios surgen de la perseverancia en lo pequeño.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"La rendición confiada coloca todos los frutos en manos de la sabiduría suprema.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Permanece en mí y yo en ti.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

{t:"Estoy atento. Estoy en paz. Mi voluntad es firme y tranquila.",a:"P. Yogananda","c":"PARAMAHANSA YOGANANDA - LEY Y AMOR"},

// NAPOLEÓN HILL - ANTES DEL ORO (29)

{t:"La riqueza no se piensa, se siente. Y solo cuando se siente con intensidad comienza a existir.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"Lo que usted siente con certeza, el mundo lo ejecuta.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El universo no responde al pensamiento débil. Responde a la emoción sostenida.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El oro no se encuentra con mapas, se encuentra con el corazón.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El sentimiento precede al oro.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El deseo ardiente, sellado y dirigido, mueve trenes enteros.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"La geometría del deseo ardiente se mide: intensidad, duración y foco.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El deseo estructurado transforma. El deseo desordenado arrastra.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El subconsciente no obedece palabras vacías. Solo responde a imágenes cargadas de emoción.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"Lo que usted siente con persistencia será más poderoso que cualquier herramienta técnica.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"Uno no inventa por la mente. Inventa por la necesidad de lo que aún no existe.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"La fe es la emoción del deseo cumplido que se siente como presente.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"La riqueza no llega como recompensa. Llega como eco de una emoción total sostenida.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El oro no llega por azar. Llega porque no tiene otra opción.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El trabajo no produce riqueza. Es la descarga natural del sentimiento interno de riqueza.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"Un acto sencillo hecho con espíritu de riqueza vale más que 1000 horas de labor mecánica.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El entorno externo es un espejo de lo que su emoción dominante sostiene en su interior.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"Cuando lo arregle para su emoción, el mundo comenzará a arreglarse para usted.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El que se siente rico trabaja como quien confirma una verdad interior.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"Usted será rico cuando su emoción de riqueza haya desplazado por completo toda duda.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"Sienta como quien ordena. Sienta como quien construye. Sienta como quien ya posee.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"La duda es la grieta por la cual se escapa el oro.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"La pureza emocional no significa perfección. Significa coherencia.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"Trabaje como quien ya es rico. No lo diga, no lo aparente. Siéntalo.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El espacio que usted habita se convierte en altar de su convicción.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El lenguaje del subconsciente es emocional, no lógico. Es pictórico, no verbal.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El pensamiento es la chispa, la emoción es la corriente, la imagen sentida es el mensaje.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"El universo reconoce a quien ya está actuando como emisario de una riqueza sentida.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

{t:"Cada mañana usted debe revivir su visión como una escena sentida profundamente.",a:"Napoleón Hill","c":"NAPOLEÓN HILL - ANTES DEL ORO"},

// JOSEPH MURPHY - MAPA ESMERALDA (32)

{t:"Toda célula es mente organizada. Todo órgano es pensamiento solidificado.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Tu cuerpo no es un campo de batalla, es un campo de cultivo. Siembra luz, cosecharás luz.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Mis células obedecen la ley divina. El patrón original de mi cuerpo es armonía.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Toda enfermedad es una distorsión del patrón original. Toda curación es un retorno al diseño arquetípico.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Tu cuerpo responde a decretos. Cada célula es un escriba atento.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"El cuerpo de carne es una sombra. La luz está en tu mente.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Toda palabra es una semilla vibratoria. Cada célula oye.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"La vibración que tú emites determina tu salud, no tus deseos racionales.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"El sonido reestructura el campo electromagnético.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"El aire me vivifica, mis pensamientos fluyen, el espíritu circula en mí.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Yo filtro mis pensamientos. Mi mente limpia. Solo lo verdadero circula en mí.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"El pasado está disuelto en la gracia eterna. Yo soy libre ahora. Mi historia es luz.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Yo redimo esta memoria. Yo soy el dueño de mi historia. Todo se reescribe en la luz.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Este espacio es luz. Cada rincón vibra en orden. Mi cuerpo reconoce esta frecuencia.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Yo soy limpio por dentro y por fuera. Mi espacio refleja mi armonía.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Este hogar es mi templo. Cada pared sostiene mi bienestar.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Lo que he recibido, lo comparto. Lo que bendigo crece. Yo soy multiplicador de luz.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Tú no estás roto. Tú estás en proceso.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"No necesitas fórmulas secretas ni intermediarios místicos. El poder de regenerar está en ti.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Cada pensamiento que albergas activa procesos bioquímicos que se convierten en síntomas o en salud.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"No esperes a enfermarte para reprogramar tus pensamientos. Hazlo ahora.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"El espacio vibra y tú vibras con él.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Tu casa puede enfermarte o sanar según como la codifiques.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"No puedes sanar tu piel sin mirar tu entorno.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"La mayor prisión del ser humano no es el presente ni el futuro. Es el pasado no sanado.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Sanar el tiempo es sanar el cuerpo.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Enseñar no es adoctrinar. Enseñar es testimoniar.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Mi mente es firme. Mis manos están en paz. Yo soy fortaleza divina.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"El milagro es la ley natural aplicada con fe constante e intención elevada.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Lo orgánico no es causa, es efecto. La carne no crea la idea, es la idea quien le da forma.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"Tu cuerpo se convierte en lo que tu mente cree.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

{t:"No declares lo que ves. Decreta lo que es.",a:"Joseph Murphy","c":"JOSEPH MURPHY - MAPA ESMERALDA"},

// JOSEPH MURPHY - DECISIONES (30)

{t:"Toda decisión verdadera es una afirmación de fe operativa.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Decidir no es un acto lógico, es un acto espiritual.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"La decisión perfecta es la que armoniza con la sabiduría interior.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Dejo que la sabiduría en mí elija ahora.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"No existe tal cosa como una decisión neutral.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"El hombre de doble ánimo es inconstante en todos sus caminos.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"La verdadera paz no es la ausencia de movimiento, sino la presencia de dirección.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Toda decisión auténtica se reconoce por la paz que deja.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"La paz es el árbitro que Dios colocó en tu alma para que nunca te pierdas.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"No sigas la voz más fuerte. Sigue la más pacífica.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"La sabiduría no grita, no presiona. La sabiduría susurra.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Mi mente está fija en el bien. La sabiduría en mí decide con orden perfecto.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"La provisión del infinito fluye hacia mí con orden perfecto.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"En silencio y confianza está mi fortaleza.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Mi decisión está sellada en paz. Camino en firmeza y gracia.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"La paz de Dios gobierna mis decisiones.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Dios no nos ha dado espíritu de cobardía, sino de poder, amor y dominio propio.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Primero paz, luego decisión.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Lo que fue ahora sirve a mi bien. Lo entrego, lo bendigo, lo libero.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"No pudiste haber elegido mejor en aquel momento, dado el nivel de conciencia que tenías.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"El alma no avanza por olvido, sino por comprensión.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Nada fue en vano. Nada se pierde en la economía del espíritu.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Mi cuerpo responde a la paz de mi alma.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Prospero en todo, porque la sabiduría en mí elige el camino perfecto.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Todo coopera para mi bien. Todo está guiado. Todo responde al orden perfecto.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Elige lo que más bendice, lo que más edifica, lo que más sirve.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Camino en relaciones que elevan mi conciencia.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"La regla de oro: haz a otros lo que quisieras que te hagan a ti.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Cada pensamiento de temor es una semilla abortiva. No siembres lo que luego lamentarás.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

{t:"Confía en el Señor con todo tu corazón y no te apoyes en tu propia prudencia.",a:"Joseph Murphy","c":"JOSEPH MURPHY - DECISIONES"},

// ALEISTER CROWLEY - RIQUEZA MÁGICA (40)

{t:"Cada ser traza su trayectoria única, inconfundible, inevitable.",a:"A. Crowley","c":"ALEISTER CROWLEY - RIQUEZA MÁGICA"},

{t:"Todo sufrimiento brota de la fricción con trayectorias que no nos pertenecen.",a:"A. Crowley","c":"ALEISTER CROWLEY - RIQUEZA MÁGICA"},

{t:"El hombre que no conoce su voluntad es sombra arrastrada por vientos ajenos.",a:"A. Crowley","c":"ALEISTER CROWLEY - RIQUEZA MÁGICA"},

{t:"A cada uno su estrella. A cada estrella su órbita. A cada órbita su gloria.",a:"A. Crowley","c":"ALEISTER CROWLEY - RIQUEZA MÁGICA"},

{t:"La verdadera voluntad se manifiesta por continuidad sin fricción y aumento espontáneo de energía.",a:"A. Crowley","c":"ALEISTER CROWLEY - RIQUEZA MÁGICA"},

{t:"Todo acto que produce cansancio, confusión o arrepentimiento no es voluntad, sino desviación.",a:"A. Crowley","c":"ALEISTER CROWLEY - RIQUEZA MÁGICA"},

{t:"Tu única salvación es la ciencia rigurosa de ti mismo.",a:"A. Crowley","c":"ALEISTER CROWLEY - RIQUEZA MÁGICA"},

{t:"El pecado supremo es la restricción: negar la voluntad, disfrazarla, traicionarla.",a:"A. Crowley","c":"ALEISTER CROWLEY - RIQUEZA MÁGICA"},

{t:"Cada hombre y cada mujer es una estrella.",a:"A. Crowley","c":"ALEISTER CROWLEY - RIQUEZA MÁGICA"},

// EMMET FOX - NUEVAS (10)

{t:"Yo declaro con autoridad divina que todo obstáculo se disuelve ahora ante la luz de mi conciencia despierta.",a:"Emmet Fox"},

{t:"Mi mente es un canal perfecto del bien universal; todo lo que toco se bendice y se multiplica.",a:"Emmet Fox"},

{t:"Declaro que la ley divina opera en mi vida con precisión infalible; no hay error ni retraso en mi bien.",a:"Emmet Fox"},

{t:"Yo soy la conciencia del Cristo manifestándose; toda limitación es ilusión que se desvanece.",a:"Emmet Fox"},

{t:"Proclamo que mi pensamiento es poder creador; lo que afirmo se manifiesta sin obstáculo.",a:"Emmet Fox"},

{t:"Declaro cerrada la puerta a toda negatividad; solo el bien divino tiene acceso a mi mente.",a:"Emmet Fox"},

{t:"Yo decreto que la paz, la salud y la prosperidad son mi estado natural e inmutable.",a:"Emmet Fox"},

{t:"Declaro que ninguna circunstancia externa tiene poder sobre mí; yo soy gobernado solo por la ley divina.",a:"Emmet Fox"},

{t:"Yo afirmo que el bien fluye hacia mí sin esfuerzo, porque soy un canal abierto del infinito.",a:"Emmet Fox"},

{t:"Yo habito en el estado de mi deseo cumplido; el mundo exterior se reorganiza para reflejar mi interior.",a:"Neville Goddard"},

{t:"Tú eres el soñador y el sueño; todo lo que imaginas con sentimiento se convierte en tu mundo.",a:"Neville Goddard"},

{t:"Yo soy el Dios que se despierta en forma humana; mi imaginación es el poder creador del universo.",a:"Neville Goddard"},

{t:"Cada noche al dormir, yo reviso mi día y elijo la versión perfecta de toda experiencia.",a:"Neville Goddard"},

{t:"No busco afuera lo que ya soy adentro; mi estado interno es la causa de todo lo que veo.",a:"Neville Goddard"},

{t:"Tú no estás en el mundo; el mundo está en ti. Lo que asumes como verdad se manifiesta.",a:"Neville Goddard"},

{t:"Mi imaginación es el Cristo que despierta; en ella, todo deseo es un hecho cumplido.",a:"Neville Goddard"},

{t:"Yo vivo desde el cumplimiento, no hacia él. El futuro ya existe en mi conciencia.",a:"Neville Goddard"},

{t:"Tú eres la causa primera; nada puede manifestarse sin que primero lo hayas sentido real.",a:"Neville Goddard"},

// JOSEPH MURPHY - NUEVAS (10)

{t:"Mi subconsciente conoce la respuesta perfecta a cada problema; yo solo necesito confiar y soltar.",a:"Joseph Murphy"},

{t:"Doy gracias anticipadamente porque sé que mi mente subconsciente ya está trabajando en mi petición.",a:"Joseph Murphy"},

{t:"La curación ocurre cuando mi mente subconsciente acepta la verdad de mi perfección natural.",a:"Joseph Murphy"},

{t:"Repito con fe: 'Todo se resuelve perfectamente' — y mi subconsciente hace que así sea.",a:"Joseph Murphy"},

{t:"Mi subconsciente es un océano de poder ilimitado; cualquier cosa que le pidas con fe, la cumple.",a:"Joseph Murphy"},

// FLORENCE SCOVEL SHINN - NUEVAS (10)

{t:"Doy el siguiente paso con fe perfecta; el universo coloca bajo mis pies el camino firme.",a:"Florence Scovel Shinn"},

{t:"Yo declaro que ningún mal me alcanza; solo el bien divino me rodea y me sostiene.",a:"Florence Scovel Shinn"},

// W.W. ATKINSON - NUEVAS (10)

const prayers=[

{t:"Señor de mi alma, aquí me tienes. Aparto el ruido de mi mente. Retiro los velos de la prisa y la preocupación. Hazme digno de cruzar el portal de la quietud. Permite que tu voz se escuche en el fondo de mi ser.",a:"Emmet Fox"},

{t:"Padre eterno, que en el silencio de este momento yo reconozca tu presencia en mi interior. Haz que mi mente se aquiete, que mi corazón se abra, que mi alma te conozca más allá de las palabras.",a:"Emmet Fox"},

{t:"Señor de la paz, enséñame a dormir en tu silencio aunque la tormenta ruja a mi alrededor. Que el miedo no me arrastre, que la prisa no me domine. Haz de tu silencio mi fuerza y mi refugio.",a:"Emmet Fox"},

{t:"Padre, enséñame a escuchar con el alma. Haz que mi corazón distinga tu voz entre todos los sonidos del mundo. Que tu guía serena se imponga sobre todo deseo ansioso.",a:"Emmet Fox"},

{t:"Padre fiel, dame perseverancia en el silencio, paciencia en la espera, humildad para aceptar mi camino. Que cada día honre los silencios de mi alma y confíe en tu presencia.",a:"Emmet Fox"},

{t:"Señor, dame ojos para ver los frutos de tu silencio en mi vida. Que la paz, la claridad y la energía renovada sean mi testimonio silencioso ante el mundo.",a:"Emmet Fox"},

{t:"Padre eterno, hoy consagro mi vida al silencio que es tu voz. Haz de mi mente un templo de paz, de mi corazón una fuente de quietud, de mis palabras instrumentos de tu amor.",a:"Emmet Fox"},

{t:"Espíritu, yo soy. Desde este Yo Soy, todo lo demás encuentra su sitio.",a:"Emmet Fox"},

{t:"Gracias por lo que fuiste. Pero ahora el Cristo vive en mí y él es mi única identidad.",a:"Emmet Fox"},

{t:"No soy el personaje, no soy el pasado, no soy la historia. Yo soy la frecuencia del Cristo reconociéndose a sí misma en mí.",a:"Emmet Fox"},

{t:"Dejo que la sabiduría en mí elija ahora. Mi mente está fija en el bien. La sabiduría en mí decide con orden perfecto.",a:"Joseph Murphy"},

{t:"En silencio y confianza está mi fortaleza. Gracias porque he sido guiado.",a:"Joseph Murphy"},

{t:"Mi decisión está sellada en paz. Camino en firmeza y gracia. Todo coopera para mi bien.",a:"Joseph Murphy"},

{t:"La paz de Dios gobierna mis decisiones. Confío en el Señor con todo mi corazón y no me apoyo en mi propia prudencia.",a:"Joseph Murphy"},

{t:"Lo que fue ahora sirve a mi bien. Lo entrego, lo bendigo, lo libero. Nada fue en vano.",a:"Joseph Murphy"},

{t:"Gracias, espíritu infinito, porque ya está hecho. Mis células obedecen la ley divina. El patrón original de mi cuerpo es armonía.",a:"Joseph Murphy"},

{t:"El dinero es un río dorado que fluye en mí y a través de mí. Nada se estanca, todo circula, todo retorna multiplicado.",a:"Joseph Murphy"},

{t:"Mi corazón de oro late con la abundancia del infinito. Cada latido es riqueza, cada exhalación es prosperidad. Todo circula, nada falta.",a:"Joseph Murphy"},

{t:"Yo soy el cauce perfecto del río de abundancia infinita. Nada me falta. Todo circula, todo retorna multiplicado.",a:"Joseph Murphy"},

{t:"Estoy atento. Estoy en paz. Mi voluntad es firme y tranquila. La verdadera concentración florece en un terreno de relajación consciente.",a:"P. Yogananda"},

{t:"Gracias, Padre, porque ya está hecho. Todo está bien. Estoy en paz. Confío en la ley.",a:"P. Yogananda"},

{t:"Que la disciplina sea mi aliada. Que mi energía se eleve hacia la luz. Que la gracia me colme más allá de mis esfuerzos.",a:"P. Yogananda"},

{t:"Hoy mi mente sea clara, mi corazón esté abierto y mi intuición me guíe en cada paso.",a:"P. Yogananda"},

{t:"Yo soy salud perfecta. La energía de Dios fluye a través de mí como un río vivificante.",a:"Napoleón Hill"},

{t:"Cada mañana revivo mi visión como una escena sentida profundamente. Siento como quien ordena, como quien construye, como quien ya posee.",a:"Napoleón Hill"},

{t:"Dinero querido, te honro y te respeto. Eres mi aliado divino y vienes a mí multiplicado y bendecido.",a:"F. Scovel Shinn"},

{t:"Yo Soy el Alfa y la Omega, el principio y el fin. Desde este centro creador, toda mi vida se ordena perfectamente.",a:"Neville Godard"},

{t:"Soy próspero ahora. La riqueza fluye en mí. La abundancia me rodea. Mi fe transporta abundancia a cada área de mi vida.",a:"Joseph Murphy"},
