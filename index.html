// AMBIENT SOUND SYSTEM (Web Audio API)

// ═══════════════════════════════════════════

let ambientCtx=null;

let ambientNodes=[];

let ambientGain=null;

let ambientType=null;

let ambientPlaying=false;

let pianoInterval=null;

function initAmbientAudio(){

if(ambientCtx)return;

ambientCtx=new(window.AudioContext||window.webkitAudioContext)();

ambientGain=ambientCtx.createGain();

ambientGain.gain.value=0.3;

ambientGain.connect(ambientCtx.destination);

}

function stopAmbientSound(){

ambientNodes.forEach(n=>{

try{

if(n.stop)n.stop();

if(n.disconnect)n.disconnect();

}catch(e){}

});

ambientNodes=[];

if(pianoInterval){clearInterval(pianoInterval);pianoInterval=null;}

ambientPlaying=false;

const btn=document.getElementById('ambientPlayBtn');

if(btn){btn.textContent='▶';btn.classList.remove('playing');}

}

function createNoiseBuffer(duration){

const sampleRate=ambientCtx.sampleRate;

const length=sampleRate*duration;

const buffer=ambientCtx.createBuffer(1,length,sampleRate);

const data=buffer.getChannelData(0);

for(let i=0;i<length;i++){

data[i]=Math.random()*2-1;

}

return buffer;

}

function createBrownNoiseBuffer(duration){

const sampleRate=ambientCtx.sampleRate;

const length=sampleRate*duration;

const buffer=ambientCtx.createBuffer(1,length,sampleRate);

const data=buffer.getChannelData(0);

let lastOut=0;

for(let i=0;i<length;i++){

const white=Math.random()*2-1;

data[i]=(lastOut+(0.02*white))/1.02;

lastOut=data[i];

data[i]*=3.5;

}

return buffer;

}

const ambientSounds={

rain(){

// White noise filtered through bandpass for rain

const noise=ambientCtx.createBufferSource();

noise.buffer=createNoiseBuffer(10);

noise.loop=true;

const filter=ambientCtx.createBiquadFilter();

filter.type='bandpass';

filter.frequency.value=3000;

filter.Q.value=0.5;

const filter2=ambientCtx.createBiquadFilter();

filter2.type='highpass';

filter2.frequency.value=1000;

const gain=ambientCtx.createGain();

gain.gain.value=0.6;

noise.connect(filter);

filter.connect(filter2);

filter2.connect(gain);

gain.connect(ambientGain);

noise.start();

ambientNodes.push(noise,filter,filter2,gain);

},

piano(){

// Gentle piano-like tones with envelope

const notes=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25,587.33,659.25];

function playNote(){

if(!ambientPlaying)return;

const freq=notes[Math.floor(Math.random()*notes.length)];

const osc=ambientCtx.createOscillator();

const gain=ambientCtx.createGain();

osc.type='sine';

osc.frequency.value=freq;

// Soft envelope

const now=ambientCtx.currentTime;

gain.gain.setValueAtTime(0,now);

gain.gain.linearRampToValueAtTime(0.15,now+0.1);

gain.gain.exponentialRampToValueAtTime(0.001,now+3);

osc.connect(gain);

gain.connect(ambientGain);

osc.start(now);

osc.stop(now+3);

}

playNote();

pianoInterval=setInterval(playNote,2000+Math.random()*2000);

},

waves(){

// Brown noise modulated for ocean waves

const noise=ambientCtx.createBufferSource();

noise.buffer=createBrownNoiseBuffer(10);

noise.loop=true;

const lfo=ambientCtx.createOscillator();

lfo.type='sine';

lfo.frequency.value=0.08;

const lfoGain=ambientCtx.createGain();

lfoGain.gain.value=0.3;

lfo.connect(lfoGain);

const mainGain=ambientCtx.createGain();

mainGain.gain.value=0.7;

lfoGain.connect(mainGain.gain);

const filter=ambientCtx.createBiquadFilter();

filter.type='lowpass';

filter.frequency.value=500;

noise.connect(filter);

filter.connect(mainGain);

mainGain.connect(ambientGain);

noise.start();

lfo.start();

ambientNodes.push(noise,lfo,lfoGain,mainGain,filter);

},

binaural(){

// Two slightly different frequencies for binaural beats

const baseFreq=200;

const beatFreq=6; // theta range

const osc1=ambientCtx.createOscillator();

osc1.type='sine';

osc1.frequency.value=baseFreq;

const osc2=ambientCtx.createOscillator();

osc2.type='sine';

osc2.frequency.value=baseFreq+beatFreq;

const gainL=ambientCtx.createGain();

gainL.gain.value=0.25;

const gainR=ambientCtx.createGain();

gainR.gain.value=0.25;

const merger=ambientCtx.createChannelMerger(2);

osc1.connect(gainL);

osc2.connect(gainR);

gainL.connect(merger,0,0);

gainR.connect(merger,0,1);

merger.connect(ambientGain);

osc1.start();

osc2.start();

ambientNodes.push(osc1,osc2,gainL,gainR,merger);

},

fire(){

// Crackle fire effect

const noise=ambientCtx.createBufferSource();

noise.buffer=createNoiseBuffer(10);

noise.loop=true;

const filter=ambientCtx.createBiquadFilter();

filter.type='bandpass';

filter.frequency.value=800;

filter.Q.value=2;

const filter2=ambientCtx.createBiquadFilter();

filter2.type='highpass';

filter2.frequency.value=400;

const gain=ambientCtx.createGain();

gain.gain.value=0.4;

noise.connect(filter);

filter.connect(filter2);

filter2.connect(gain);

gain.connect(ambientGain);

noise.start();

// Add crackle pops with oscillators

function crackle(){

if(!ambientPlaying)return;

const osc=ambientCtx.createOscillator();

const g=ambientCtx.createGain();

osc.type='sawtooth';

osc.frequency.value=100+Math.random()*2000;

const now=ambientCtx.currentTime;

g.gain.setValueAtTime(0.08,now);

g.gain.exponentialRampToValueAtTime(0.001,now+0.05+Math.random()*0.1);

osc.connect(g);

g.connect(ambientGain);

osc.start(now);

osc.stop(now+0.15);

}

setInterval(crackle,100+Math.random()*300);

ambientNodes.push(noise,filter,filter2,gain);

}

};

function selectAmbientSound(type){

initAmbientAudio();

// Update UI buttons

document.querySelectorAll('.sound-btn').forEach(b=>b.classList.remove('active'));

const btn=document.getElementById('sound-'+type);

if(btn)btn.classList.add('active');

// Stop current sound

stopAmbientSound();

ambientType=type;

if(type==='mp3'){

// Use the existing MP3 player

const audio=document.getElementById('audioPlayer');

audio.volume=parseFloat(document.getElementById('ambientVolume').value)/100;

audio.play().catch(()=>{});

ambientPlaying=true;

document.getElementById('nowPlaying').textContent='🎶 Música original';

document.getElementById('ambientPlayBtn').textContent='⏸';

document.getElementById('ambientPlayBtn').classList.add('playing');

return;

}

// Start new ambient sound

const names={rain:'🌧️ Lluvia',piano:'🎹 Piano suave',waves:'🌊 Olas del mar',binaural:'🧘 Binaural beats',fire:'🔥 Fogata'};

document.getElementById('nowPlaying').textContent=names[type]||type;

if(ambientSounds[type]){

ambientSounds[type]();

ambientPlaying=true;

document.getElementById('ambientPlayBtn').textContent='⏸';

document.getElementById('ambientPlayBtn').classList.add('playing');

}

}

function toggleAmbientPlay(){

if(ambientPlaying){

// Pause

stopAmbientSound();

if(ambientType==='mp3'){

document.getElementById('audioPlayer').pause();

}

document.getElementById('nowPlaying').textContent='Pausado';

}else{

// Resume

if(ambientType){

selectAmbientSound(ambientType);

}else{

selectAmbientSound('rain');

}

}

}

function setAmbientVolume(val){

const vol=val/100;

if(ambientGain)ambientGain.gain.value=vol;

const audio=document.getElementById('audioPlayer');

if(audio)audio.volume=vol;

document.getElementById('ambientVolumeLabel').textContent=val+'%';

}

function toggleMusicPanel(){

document.getElementById('musicPanel').classList.toggle('show');

}

// Toast

function showToast(msg){

const t=document.getElementById('toast');

t.textContent=msg;

t.classList.add('show');

setTimeout(()=>t.classList.remove('show'),3000);

}

// Legacy music player - now handled by ambient sound system

// Swipe

document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX});

document.addEventListener('touchend',e=>{

const diff=e.changedTouches[0].clientX-touchStartX;

if(Math.abs(diff)>80){

if(diff>0)prevDay();

else nextDay();

}

});

// Keyboard

document.addEventListener('keydown',e=>{

if(e.key==='ArrowRight')nextDay();

if(e.key==='ArrowLeft')prevDay();

if(e.key==='r')randomAffirmation();

});

// Service Worker

if('serviceWorker' in navigator){

navigator.serviceWorker.register('sw.js').catch(()=>{});

}

// TTS (TEXT-TO-SPEECH) SYSTEM

// ═══════════════════════════════════════════

let ttsSpeaking = false;

let ttsUtterance = null;

let spanishVoices = [];

let selectedVoice = null;

// TTS Configuration (from localStorage or defaults)

let ttsConfig = {

  rate: parseFloat(localStorage.getItem('tts_rate')) || 0.85,

  pitch: parseFloat(localStorage.getItem('tts_pitch')) || 1.05,

  volume: 1.0,

  voiceURI: localStorage.getItem('tts_voice') || ''

};

function initTTS() {

  // Check if SpeechSynthesis is available

  if (!('speechSynthesis' in window)) {

    document.getElementById('ttsBtn').style.display = 'none';

    console.log('SpeechSynthesis not supported');

    return;

  }

  

  // Load voices (they load asynchronously in some browsers)

  loadVoices();

  if (speechSynthesis.onvoiceschanged !== undefined) {

    speechSynthesis.onvoiceschanged = loadVoices;

  }

}

function loadVoices() {

  const voices = speechSynthesis.getVoices();

  

  // Filter Spanish voices

  spanishVoices = voices.filter(v => {

    const lang = v.lang.toLowerCase();

    return lang.startsWith('es') || 

           lang.includes('es-es') || 

           lang.includes('es-mx') || 

           lang.includes('es-us') || 

           lang.includes('es-ar') || 

           lang.includes('es-co');

  });

  

  // Sort: prefer female voices (they tend to sound calmer for affirmations)

  spanishVoices.sort((a, b) => {

    const aFemale = a.name.toLowerCase().includes('female') || a.name.toLowerCase().includes('mujer') || a.name.toLowerCase().includes('maria') || a.name.toLowerCase().includes('carmen') || a.name.toLowerCase().includes('paulina') || a.name.toLowerCase().includes('helena') ? -1 : 0;

    const bFemale = b.name.toLowerCase().includes('female') || b.name.toLowerCase().includes('mujer') || b.name.toLowerCase().includes('maria') || b.name.toLowerCase().includes('carmen') || b.name.toLowerCase().includes('paulina') || b.name.toLowerCase().includes('helena') ? -1 : 0;

    return aFemale - bFemale;

  });

  

  // Update voice selector

  updateVoiceSelector();

  

  // Show warning if no Spanish voices

  const warning = document.getElementById('voiceWarning');

  if (warning) {

    warning.style.display = spanishVoices.length === 0 ? 'block' : 'none';

  }

}

function updateVoiceSelector() {

  const select = document.getElementById('voiceSelect');

  if (!select) return;

  

  select.innerHTML = '';

  

  if (spanishVoices.length === 0) {

    select.innerHTML = '<option value="">No hay voces en español</option>';

    return;

  }

  

  spanishVoices.forEach((voice, i) => {

    const option = document.createElement('option');

    option.value = voice.voiceURI;

    const label = voice.name + ' (' + voice.lang + ')';

    option.textContent = label;

    if (voice.voiceURI === ttsConfig.voiceURI || (!ttsConfig.voiceURI && i === 0)) {

      option.selected = true;

      selectedVoice = voice;

    }

    select.appendChild(option);

  });

  

  // If no voice was previously selected, select the first one

  if (!selectedVoice && spanishVoices.length > 0) {

    selectedVoice = spanishVoices[0];

    ttsConfig.voiceURI = selectedVoice.voiceURI;

  }

}

function selectVoice(voiceURI) {

  ttsConfig.voiceURI = voiceURI;

  selectedVoice = spanishVoices.find(v => v.voiceURI === voiceURI) || null;

  localStorage.setItem('tts_voice', voiceURI);

}

function updateVoiceRate(value) {

  ttsConfig.rate = parseFloat(value);

  document.getElementById('voiceRateValue').textContent = value + 'x';

  localStorage.setItem('tts_rate', value);

}

function updateVoicePitch(value) {

  ttsConfig.pitch = parseFloat(value);

  document.getElementById('voicePitchValue').textContent = value + 'x';

  localStorage.setItem('tts_pitch', value);

}

function testVoice() {

  const testText = "Esta es una prueba de voz. Las afirmaciones se escucharán así.";

  speakText(testText);

}

function speakText(text) {

  if (!('speechSynthesis' in window)) {

    showToast('⚠️ Tu navegador no soporta voz');

    return;

  }

  

  // Stop any current speech

  stopTTS();

  

  // Create utterance

  ttsUtterance = new SpeechSynthesisUtterance(text);

  

  // Apply configuration

  ttsUtterance.rate = ttsConfig.rate;

  ttsUtterance.pitch = ttsConfig.pitch;

  ttsUtterance.volume = ttsConfig.volume;

  

  // Set voice if selected

  if (selectedVoice) {

    ttsUtterance.voice = selectedVoice;

  }

  

  // Event handlers

  ttsUtterance.onstart = () => {

    ttsSpeaking = true;

    updateTTSUI(true);

  };

  

  ttsUtterance.onend = () => {

    ttsSpeaking = false;

    updateTTSUI(false);

  };

  

  ttsUtterance.onerror = (e) => {

    console.error('TTS error:', e);

    ttsSpeaking = false;

    updateTTSUI(false);

  };

  

  // Speak

  speechSynthesis.speak(ttsUtterance);

}

function stopTTS() {

  if (speechSynthesis.speaking) {

    speechSynthesis.cancel();

  }

  ttsSpeaking = false;

  updateTTSUI(false);

}

function toggleTTS() {

  if (ttsSpeaking) {

    stopTTS();

  } else {

    // Get current affirmation text

    const arr = getCurrentArray();

    const a = arr[currentDay];

    if (a && a.t) {

      // Add pauses by ensuring sentences end with periods

      let text = a.t;

      // Ensure text has proper sentence endings for natural pauses

      text = text.replace(/([^.!?])\s*$/, '$1.');

      speakText(text);

    }

  }

}

function updateTTSUI(speaking) {

  const btn = document.getElementById('ttsBtn');

  const label = document.getElementById('ttsLabel');

  const card = document.getElementById('card');

  

  if (speaking) {

    btn.classList.add('speaking');

    label.textContent = 'Pausar';

    card.classList.add('speaking');

  } else {

    btn.classList.remove('speaking');

    label.textContent = 'Escuchar';

    card.classList.remove('speaking');

  }

}

// Auto-stop TTS when changing affirmation

const originalShowAffirmation = showAffirmation;

showAffirmation = function(index) {

  stopTTS();

  originalShowAffirmation(index);

};

// Initialize TTS after page loads

initTTS();

init();
